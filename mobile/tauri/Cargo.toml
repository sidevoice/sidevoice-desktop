[package]
name = "sidevoice-mobile"
version = "0.1.0"
description = "Sidevoice mobile app: a native shell around the Sidevoice web UI"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[lib]
name = "sidevoice_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# The app's native project inputs: the Android manifest and its network security config (plugin/).
sidevoice-mobile-plugin = { path = "plugin" }
# The application host the apps share (the voice call, the engine, the provider keys) and the plugin that gives the page
# its commands (`window.__sidevoiceHost`'s members: voice, engine, microphone, pairings; src/bridge.rs).
sidevoice-shared = { path = "../../shared/core" }
sidevoice-shared-tauri = { path = "../../shared/tauri" }
# The loader of the app's own texts (src/i18n.rs).
sidevoice-shared-i18n = { path = "../../shared/i18n" }
sidevoice-shared-headset = { path = "../../shared/headset" }
tauri = { version = "2.12", features = [] }
# The pairings file (src/pairings.rs): a temporary file in the same directory, synced, renamed over the old record, the
# directory synced. Unix and Windows; the OS calls are the crate's.
atomic-write-file = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The creatures' stills reach the app as base64 (`call_still`, src/lib.rs), as the page's canvas gives them.
base64 = "0.22"
# The app's log (src/lib.rs): the system's (logcat, the unified log) and a file in the app's log folder.
tauri-plugin-log = "2"
log = "0.4"
# The camera that scans the pairing QR code (`host.codeScanner`, js/mobile-bridge.js): Tauri's official barcode scanner, CameraX
# and ML Kit on Android, AVFoundation on iOS, with the camera permission it asks for itself (docs/MOBILE.md -> "Scanning the pairing code").
tauri-plugin-barcode-scanner = "2.5.3"

[target.'cfg(target_os = "ios")'.dependencies]
# The session's interruptions (src/platform/interruption/ios.rs): the notification a phone call or an alarm makes the system post.
objc2 = "0.6"
block2 = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionRoute", "AVAudioSessionTypes"] }
# The pairings file out of the device backup (src/platform/backup/ios.rs): NSURL's `NSURLIsExcludedFromBackupKey`; and the
# interruptions' notification and its `userInfo`. Already in the iOS build through Tauri; only the types the call names.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSEnumerator", "NSError", "NSString", "NSURL", "NSValue", "NSNotification", "NSOperation", "NSDictionary", "block2"] }
# The web view, its scroll view and the window behind it (src/platform/webview/ios.rs): UIKit's views and colours, typed
# (`objc2` above for the one property, `WKWebView.scrollView`, objc2-web-kit does not wrap).
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIColor", "UIDevice", "UIGeometry", "UIGestureRecognizer", "UIInterface", "UIPinchGestureRecognizer", "UIResponder", "UIScreen", "UIScrollView", "UIView", "UIViewController", "UIWindow", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(target_os = "android")'.dependencies]
# The engine's HTTPS (remote providers, model downloads) verifies certificates with Android's own verifier, which calls into
# the JVM and has to be told the app's context once (src/platform/tls/android.rs). The version is the one the engine's
# reqwest resolves, so there is one verifier in the build; jni is its own, ndk-context Tauri's.
rustls-platform-verifier = "0.6"
jni = { version = "0.21", default-features = false }
ndk-context = "0.1"

[dev-dependencies]
tempfile = "3"
