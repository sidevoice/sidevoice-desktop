[package]
name = "sidevoice-desktop-test-support"
version = "0.1.0"
edition = "2021"
workspace = "../src-tauri"
rust-version = "1.98"
publish = false
license = "Apache-2.0"
description = "Local-host fixtures and native fake connector; never shipped."

[dependencies]
keyring-core = "1.0.1"
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.14.0", features = ["test-support"] }
process-wrap = { version = "10", default-features = false, features = ["std", "process-session", "creation-flags"] }
serde_json = "1"
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
sha1 = "0.10"
sha2 = "0.10"
getrandom = "0.3"
flate2 = "1"
tar = { version = "0.4", default-features = false }
httparse = "1"
tokio-util = { version = "0.7", features = ["io-util"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
# The local host the fixtures drive (`fake_registry`'s `Fetch`, `local-host-ci`'s serve mode) and the tests exercise.
sidevoice-local-host = { path = "../src-tauri/local-host" }

[target.'cfg(unix)'.dependencies]
# The core's socket opened raw, without the peer check `sidevoice_platform::ipc` adds (local_host's attack); already
# in the graph through it.
interprocess = "2.4"

[target.'cfg(windows)'.dependencies]
# The process flags `process-wrap`'s `CreationFlags` takes.
windows = { version = "0.62", features = ["Win32_System_Threading"] }
# The reset handoff (`src-tauri`'s `platform/reset_handoff/windows.rs`, included by `tests/portable.rs`) holds the
# parent process with it, as the app does.
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
keyring-core = { version = "1.0.1", features = ["sample"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
