[package]
name = "sidevoice-desktop-test-support"
version = "0.1.0"
edition = "2021"
workspace = "../src-tauri"
rust-version = "1.98"
publish = false
license = "Apache-2.0"
description = "Local-host fixtures and native fake connector; never shipped."

[dependencies]
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.12.4", features = ["test-support"] }
process-wrap = { version = "10", default-features = false, features = ["std", "process-session"] }
serde_json = "1"
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
sha1 = "0.10"
sha2 = "0.10"
getrandom = "0.3"
flate2 = "1"
tar = { version = "0.4", default-features = false }
httparse = "1"
tokio-util = { version = "0.7", features = ["io-util"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }

[target.'cfg(unix)'.dependencies]
sidevoice-local-host = { path = "../src-tauri/local-host" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
