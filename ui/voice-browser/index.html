<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de voz en navegador</title><style>body{font:16px system-ui;background:#151b23;color:#e8eef6;max-width:820px;margin:40px auto;padding:20px}textarea,select,button{font:inherit;color:inherit;background:#263342;border:1px solid #536578;border-radius:10px;padding:12px}textarea{width:100%;box-sizing:border-box;min-height:120px}label{display:block;margin:15px 0}button{cursor:pointer;margin-right:8px}#status{padding:18px;background:#233b34;border-radius:12px;line-height:1.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202a36;padding:15px;max-height:300px;overflow:auto;font-size:12px}.muted{color:#a7b8ca}</style><h1>Kokoro en tu navegador</h1><p class="muted">Prueba independiente. La síntesis se ejecuta aquí; no envía el texto a un servicio de voz. La primera carga descarga el modelo.</p><label>Motor<select id="device"><option value="auto">GPU automática / CPU si no está disponible</option><option value="webgpu">Forzar WebGPU</option><option value="wasm">Forzar CPU (WebAssembly)</option></select></label><label>Voz<select id="voice"><option value="ef_dora">Dora · español</option><option value="af_heart">Heart · English</option></select></label><label>Texto<textarea id="text">Hola. Esta voz se genera en el navegador, usando los recursos de tu ordenador.</textarea></label><button id="load">Preparar modelo</button><button id="speak">Hablar</button><button id="stop">Detener</button><p id="status" role="status">Sin cargar</p><pre id="log"></pre><script type="module">
const $=id=>document.getElementById(id);let worker=null,request=0,context=null,sources=[],end=0;
const log=text=>{$('log').textContent+=text+'\n';$('log').scrollTop=$('log').scrollHeight};
function stop(){request++;worker?.postMessage({type:'cancel'});for(const source of sources){try{source.stop()}catch{}}sources=[];end=0;$('status').textContent='Detenido; se descartan resultados pendientes'}
function ensure(){if(worker)return;worker=new Worker('/voice-browser/worker.js',{type:'module'});worker.onerror=e=>{$('status').textContent='Error del worker: '+e.message;log(e.message)};worker.onmessage=({data:d})=>{if(d.id!==request)return;if(d.type==='progress'){$('status').textContent='Cargando '+(d.progress.file||'modelo')+' '+(d.progress.progress?Math.round(d.progress.progress)+'%':'')}if(d.type==='fallback')log('Alternativa CPU: '+d.reason);if(d.type==='ready'){$('status').textContent='Listo · '+d.device;log('Motor real: '+d.device)}if(d.type==='audio'){const buffer=context.createBuffer(1,d.samples.length,d.sampleRate);buffer.copyToChannel(d.samples,0);const source=context.createBufferSource();source.buffer=buffer;source.connect(context.destination);const start=Math.max(context.currentTime+.03,end);source.start(start);end=start+buffer.duration;sources.push(source);log(JSON.stringify({text:d.text,phonemes:d.phonemes,duration:buffer.duration,ms:Math.round(d.elapsedMs),device:d.device}));$('status').textContent='Reproduciendo · '+d.device}if(d.type==='done'){log('Síntesis completa');$('status').textContent='Síntesis completa · audio en reproducción'}if(d.type==='error'){$('status').textContent='Error: '+d.error;log(d.error)}}}
$('load').onclick=()=>{stop();worker?.terminate();worker=null;ensure();request++;worker.postMessage({type:'load',id:request,device:$('device').value});$('status').textContent='Preparando…'};
$('speak').onclick=async()=>{stop();ensure();context??=new AudioContext();await context.resume();request++;worker.postMessage({type:'speak',id:request,device:$('device').value,voice:$('voice').value,speed:1,text:$('text').value});$('status').textContent='Generando…'};
$('stop').onclick=stop;
$('device').onchange=()=>{stop();worker?.terminate();worker=null};
$('voice').onchange=()=>{$('text').value=$('voice').value==='af_heart'?'Hello. This voice is generated in your browser, using your own computer.':'Hola. Esta voz se genera en el navegador, usando los recursos de tu ordenador.'};
window.addEventListener('beforeunload',()=>worker?.terminate());log('WebGPU expuesto: '+Boolean(navigator.gpu));
</script></html>
