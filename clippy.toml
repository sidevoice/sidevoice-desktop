# What only `platform` may call (each crate’s platform module): the OS goes through one module per crate.
disallowed-methods = [
    { path = "libc::geteuid", reason = "use platform::user", allow-invalid = true },
    { path = "libc::getuid", reason = "use platform::user", allow-invalid = true },
    { path = "libc::gethostname", reason = "use platform::user", allow-invalid = true },
    { path = "libc::getpwuid", reason = "use platform::user", allow-invalid = true },
    { path = "std::os::unix::fs::OpenOptionsExt::mode", reason = "use platform::fs (Fs::open_private, create_private_dir)", allow-invalid = true },
    { path = "std::os::unix::fs::OpenOptionsExt::custom_flags", reason = "use platform::fs (Fs::open_read, open_private)", allow-invalid = true },
    { path = "std::os::unix::fs::MetadataExt::mode", reason = "use platform::fs (Fs::others, check_private_*)", allow-invalid = true },
    { path = "std::os::unix::fs::MetadataExt::nlink", reason = "use platform::fs (Fs::link_count)", allow-invalid = true },
    { path = "libc::kill", reason = "use platform::process", allow-invalid = true },
    { path = "tokio::process::Command::process_group", reason = "use platform::process", allow-invalid = true },
    { path = "std::os::unix::process::CommandExt::process_group", reason = "use platform::process", allow-invalid = true },
    { path = "std::os::unix::process::ExitStatusExt::signal", reason = "use platform::process", allow-invalid = true },
    { path = "tokio::signal::ctrl_c", reason = "use platform::lifecycle", allow-invalid = true },
    { path = "tokio::signal::unix::signal", reason = "use platform::lifecycle", allow-invalid = true },
    { path = "tokio::signal::windows::ctrl_c", reason = "use platform::lifecycle", allow-invalid = true },
    { path = "tokio::signal::windows::ctrl_close", reason = "use platform::lifecycle", allow-invalid = true },
    { path = "tokio::signal::windows::ctrl_logoff", reason = "use platform::lifecycle", allow-invalid = true },
    { path = "tokio::signal::windows::ctrl_shutdown", reason = "use platform::lifecycle", allow-invalid = true },
]

# Local sockets: `platform::ipc` is the only place that opens one (a Unix socket, a named pipe on Windows).
# The third-party sockets of `adapters/` go through `platform::foreign`.
disallowed-types = [
    { path = "tokio::net::UnixListener", reason = "use platform::ipc", allow-invalid = true },
    { path = "tokio::net::UnixStream", reason = "use platform::ipc", allow-invalid = true },
    { path = "std::os::unix::net::UnixListener", reason = "use platform::ipc", allow-invalid = true },
    { path = "std::os::unix::net::UnixStream", reason = "use platform::ipc", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram", reason = "use platform::ipc", allow-invalid = true },
]
