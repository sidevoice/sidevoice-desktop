<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>S0 spike</title>
  <style>
    body { font: 15px/1.45 -apple-system, system-ui, sans-serif; margin: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px 32px; background: #111; color: #eee; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 22px 0 6px; color: #aaa; text-transform: uppercase; letter-spacing: .04em; }
    p { margin: 4px 0; color: #bbb; }
    button { font: inherit; font-weight: 600; width: 100%; padding: 12px; margin: 6px 0; border: 0; border-radius: 10px; background: #2d6cdf; color: #fff; }
    button.secondary { background: #333; }
    button.danger { background: #8a2b2b; }
    input { font: inherit; width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #1c1c1c; color: #eee; }
    pre { white-space: pre-wrap; word-break: break-all; background: #1c1c1c; padding: 10px; border-radius: 8px; font-size: 12px; }
    label { display: block; margin-top: 8px; color: #bbb; }
  </style>
</head>
<body>
  <h1>S0 spike</h1>
  <p>Does the room page stay alive on a locked phone while the audio is native? (sidevoice-desktop#290)</p>

  <h2>Now</h2>
  <pre id="status">…</pre>
  <button id="open" class="secondary">Open the room page</button>
  <button id="end" class="danger">End the run</button>

  <h2>Start a run</h2>
  <label>Synthetic turn every (seconds, run N)<input id="every" type="number" min="10" value="60"></label>
  <button id="run-n">Run N: native audio held</button>
  <button id="run-p">Run P: page audio (control)</button>

  <h2>Results</h2>
  <label>Results URL on your machine (printed by receive-logs.mjs)<input id="url" type="url" placeholder="http://192.168.1.20:8799"></label>
  <button id="send" class="secondary">Send all runs to that URL</button>
  <pre id="runs">…</pre>

  <script src="launcher.js"></script>
</body>
</html>
