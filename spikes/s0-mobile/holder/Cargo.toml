[package]
name = "tauri-plugin-s0-holder"
version = "0.0.0"
edition = "2021"
publish = false
links = "tauri-plugin-s0-holder"
description = "S0 spike: the native audio holder (Swift on iOS, a Kotlin foreground service on Android)"

[dependencies]
tauri = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
