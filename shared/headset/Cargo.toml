[package]
name = "sidevoice-shared-headset"
version = "0.3.0"
description = "What a headset's presses do: the choices, the change the page asks for, the status the page reads. serde only, so any crate may use it; no Tauri, no engine."
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
