[package]
name = "sidevoice-shared-i18n"
version = "0.3.0"
description = "The one loader of the apps' texts: a JSON table per language, English the fallback. serde_json only, so any crate may use it; no Tauri, no engine."
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
serde_json = "1"
