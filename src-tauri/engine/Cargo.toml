[package]
name = "sidevoice-desktop-engine"
version = "0.1.0"
description = "Native model engines, downloaded at run time (docs/ENGINES.md): fetch, verify, unpack, load, run."
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[dependencies]
sidevoice-desktop-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.9"
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.6"
# SPIKE: rustls so the engine crate builds in the pod (no OpenSSL headers there); main keeps native-tls.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

# The machine's total memory (src/memory.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
