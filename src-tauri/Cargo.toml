[package]
name = "sidevoice-desktop"
version = "0.1.0"
description = "Sidevoice desktop client: a native shell around the Sidevoice web UI"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "sidevoice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["core"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
sidevoice-desktop-core = { path = "core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
url = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
