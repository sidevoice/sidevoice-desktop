[package]
name = "sidevoice-desktop"
version = "0.2.1"
description = "Sidevoice desktop client: a native shell around the Sidevoice web UI"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[lib]
name = "sidevoice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["core", "engine", "local-host", "../test-support"]

[features]
# CI only (src/probe.rs): the probe page and the switch that loads it. Never in a release build.
probe = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
keyring-core = "1.0.1"
# Shared paths, held-directory storage, authenticated channels, detached helper execution and browser-data removal.
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.12.4" }
sidevoice-desktop-core = { path = "core" }
sidevoice-desktop-engine = { path = "engine" }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The system's preferred languages, for the app's native texts (core i18n).
sys-locale = "0.3"
# Match the registered NSIS executable by native file identity (also handles Windows path casing).
same-file = "1"
# The local data folder Tauri gives the webview (`app_local_data_dir`), for its storage removal; already in Tauri's graph.
dirs = "7"
# The app-data deletion's interim check between home and the held parent (platform/app_data.rs): canonical paths
# without Windows verbatim prefixes, and the volume a directory is on.
dunce = "1"
file-id = "0.2"
# Probe-only RSS observations use the maintained portable API; no GPU estimates.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Friendly computer names via the OS APIs (platform/host); already in the shared platform graph.
whoami = "2.1"
url = "2.5"
# The app's updates (src/updater.rs; docs/BRIDGE.md → "The updater"), from Rust only: the page gets none of its
# commands. Its checks sleep on the app's Tokio runtime.
tauri-plugin-updater = "2.13"
# The call runs on this runtime too; the models' native work goes to its blocking pool (src/voice/models.rs).
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "net", "io-util", "process", "macros"] }
# The voice call the app runs itself (src/voice.rs, `host.voice`): sidevoice-voice with its native microphone and
# speaker (cpal) and Sonora's pure-Rust echo cancellation between them (no C++ to build), on the models the app hands
# it (src/voice/models.rs: the engine's). It depends on no engine. The candidate source: a try's take (StartOptions,
# VoiceEvent::Take), the pause in the person's speech, and the rendered speaker's level (VoiceEvent::PlaybackLevel).
sidevoice-voice = { git = "https://github.com/sidevoice/sidevoice-voice", tag = "v0.7.4" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# A one-use helper capability, delivered only through its inherited stdin pipe.
getrandom = "0.3"
# The app log (src/lib.rs `applog`): a rotating, size-capped file in the platform's log directory, fed by the Rust side and
# by the room page's console errors (bridge/webview-log.js).
tauri-plugin-log = "2"
# The system microphone privacy page, from Rust only (platform/microphone.rs).
tauri-plugin-opener = "2"
log = "0.4"
# Whether an audio input device exists (platform/microphone): enumeration only, no stream, no prompt. WASAPI on Windows,
# CoreAudio on macOS; no feature is needed for either. Already in the tree through sidevoice-voice.
cpal = { version = "0.18", default-features = false }

# This computer's own core, its pairing and the page's proxy (src/local_host.rs; docs/LOCAL_HOST.md). Unix sockets.
# `fetch`: its install's HTTPS client, for "Prepare this computer" (docs/LOCAL_HOST.md → Install).
[target.'cfg(unix)'.dependencies]
sidevoice-local-host = { path = "local-host", features = ["fetch"] }
# The account home the user database records (platform/account/unix.rs), never `HOME`; already in the graph.
nix = { version = "0.31", default-features = false, features = ["user"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1"
regex = "1"
# The Task Scheduler task list (`schtasks /FO CSV`) read as CSV, quoting decoded (platform/connector_service/windows.rs).
csv = "1"
# The taskbar's colour, to draw the tray mark in the brand's look for it (src/tray.rs).
winreg = "0.55"
# Whether a mouse button went down elsewhere, to close the call controls card's panels, and whether the room is on another
# virtual desktop (DWM cloaked), for the card (src/call_controls.rs); the microphone device worker's COM apartment
# (src/platform/microphone/windows.rs). The profile folder the system records for the account (platform/account/windows.rs).
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_UI_Shell", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
# The typed Mach bindings (task_info, task_vm_info) for the process memory read (src/platform/diagnostics/macos.rs).
mach2 = "0.6"
# Legacy keychain namespace deletion and compatibility tests (platform/credentials).
security-framework = "3"
libc = "0.2"

# The call controls card as a non-activating panel: over full-screen apps, on every Space, never taking focus
# (src/call_controls.rs).
tauri-nspanel = "2.1"
# Headset buttons and the AirPods mute gesture (src/headset.rs).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSValue", "NSError", "NSObject", "NSArray", "NSRunLoop", "block2"] }
# The native confirmation acknowledges startup from AppKit's modal run-loop mode.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }
objc2-media-player = { version = "0.3", features = ["MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem", "block2"] }
objc2-avf-audio = { version = "0.3", features = ["AVAudioApplication", "block2"] }
# The microphone permission the room page asks for in its first-run setup (src/microphone.rs, `host.microphone`).
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
# CoreGraphics values used by the call controls card (src/call_controls.rs).
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
libc = "0.2"
# The microphone check reads the sound server, not ALSA hints: cpal's pure-Rust PulseAudio host (it also serves PipeWire,
# through pipewire-pulse). No libpulse, libpipewire or libclang: see platform/microphone/linux.rs.
cpal = { version = "0.18", default-features = false, features = ["pulseaudio"] }
# Tauri's existing native toolkit; explicit Cancel default/response for destructive confirmations.
gtk = "0.18"

[dev-dependencies]
keyring-core = { version = "1.0.1", features = ["sample"] }
# Portable pairing attack fixtures from the pinned shared filesystem interface.
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.12.4", features = ["test-support"] }
# Deterministic startup-deadline tests; no wall-clock sleeps.
tokio = { version = "1", features = ["rt", "test-util"] }
# Mock runtime for the platform interface tests; no native explorer is opened.
tauri = { version = "2.12", features = ["test"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
