[package]
name = "sidevoice-desktop"
version = "0.1.0"
description = "Sidevoice desktop client: a native shell around the Sidevoice web UI"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[lib]
name = "sidevoice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["core", "engine", "local-host"]

[features]
# CI only (src/probe.rs): the probe page and the switch that loads it. Never in a release build.
probe = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
sidevoice-desktop-core = { path = "core" }
sidevoice-desktop-engine = { path = "engine" }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The system's preferred languages, for the app's native texts (core i18n).
sys-locale = "0.3"
url = "2.5"

# This computer's own core, its pairing and the page's proxy (src/local_host.rs; docs/LOCAL_HOST.md). Unix sockets.
[target.'cfg(unix)'.dependencies]
sidevoice-local-host = { path = "local-host" }

[target.'cfg(windows)'.dependencies]
# The taskbar's colour, to draw the tray mark in the brand's look for it (src/tray.rs).
winreg = "0.55"
# Whether a mouse button went down elsewhere, to close the call controls card's panels (src/call_controls.rs).
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The voice call the app runs itself (src/voice.rs, `host.voice`): sidevoice-voice with its native microphone and
# speaker (cpal) and WebRTC's AEC3 between them, on the models the app hands it (src/voice/models.rs: the engine's).
# It depends on no engine. The 0.2.0 release. macOS
# only: AEC3's C++ does not build on Windows, and the beta ships on macOS. Its build needs meson, ninja and pkg-config.
sidevoice-voice = { git = "https://github.com/sidevoice/sidevoice-voice", tag = "v0.2.0" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The call runs on the app's Tokio runtime; the models' native work goes to its blocking pool (src/voice/models.rs).
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time"] }
# The keys of remote providers, in the keychain (src/keychain.rs).
security-framework = "3"
# The call controls card as a non-activating panel: over full-screen apps, on every Space, never taking focus
# (src/call_controls.rs).
tauri-nspanel = "2.1"
# Headset buttons and the AirPods mute gesture (src/headset.rs).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSValue", "NSError", "NSObject"] }
objc2-media-player = { version = "0.3", features = ["MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem", "block2"] }
objc2-avf-audio = { version = "0.3", features = ["AVAudioApplication", "block2"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
