[package]
name = "sidevoice-local-host"
version = "0.1.0"
description = "The local host (docs/LOCAL_HOST.md): this computer's core reached over its private local channel, paired by the app, its state, and the proxy the bundled page talks to. Blocking IO, no Tauri; the OS is reached through `sidevoice-platform`."
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[features]
# The install's real HTTPS client (`npm::Https`): the app turns it on. Off for this crate's own tests, which use the
# stand-in registry, so they build with no TLS stack.
fetch = ["dep:reqwest"]

[dependencies]
# The OS for the local host, at the tag of a core release: `D`, the local data directory, by the one rule every
# Sidevoice program shares (`data_dir`); the endpoint records the core and the connector publish in it, the local
# channel and its check that the server is this user (`ipc`); a run as a tree of its own, its bounded output, and
# whether a recorded process is there (`process`); private files, trusted programs and which file a handle is (`fs`).
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.15.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The computer's kernel hostname, used when naming the core's local pairing.
gethostname = "1.1"
# `sidevoice_platform`'s local channel and child execution are async; the local host blocks, so it drives them on a
# runtime of its own (`runtime`). Already in the tree through sidevoice-platform.
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "macros", "sync", "process"] }
# The install's scratch directory: a fresh name below the temporary directory, taken only if nobody has it, created
# private by `sidevoice_platform::fs` (`install::Scratch`); already in the tree.
tempfile = "3"
# The core's identity: ECDSA P-256 over `sidevoice-node-identity:<nonce>`, IEEE P1363 signatures.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
sha2 = "0.10"
base64 = "0.22"
# Nonces and the proxy's per-launch secret.
getrandom = "0.3"
# The proxy's secret compared in constant time.
subtle = "2.6"
# The install (docs/LOCAL_HOST.md → Install): the npm package is a gzipped tar, read entry by entry and written by hand
# (`tarball`). Both already in the app's tree (tauri-plugin-updater, sidevoice-engine); pure Rust.
flate2 = "1"
tar = { version = "0.4", default-features = false }
# The registry over HTTPS, blocking (`fetch` only): the reqwest, TLS stack (rustls, the platform's verifier) and system
# proxy the engine's model downloads and the app's updater already use; only its `blocking` client is added.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "system-proxy"], optional = true }

[dev-dependencies]
sidevoice-desktop-test-support = { path = "../../test-support" }
