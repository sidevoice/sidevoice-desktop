[package]
name = "sidevoice-local-host"
version = "0.1.0"
description = "The local host (docs/LOCAL_HOST.md): this computer's core reached over its private Unix socket, paired by the app, its state, and the proxy the bundled page talks to. Blocking IO, no Tauri, so it is tested anywhere Unix."
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[features]
# The install's real HTTPS client (`npm::Https`): the app turns it on. Off for this crate's own tests, which use the
# stand-in registry, so they build with no TLS stack.
fetch = ["dep:reqwest"]

[dependencies]
# `D`, the local data directory, by the one rule every Sidevoice program shares, and the endpoint records the core
# and the connector publish in it (`ipc::Endpoint`): at the tag of a core release.
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.13.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The computer's kernel hostname, used when naming the core's local pairing.
gethostname = "1.1"

[target.'cfg(unix)'.dependencies]
# The socket peer's uid (`getpeereid` / `SO_PEERCRED`) and the effective uid.
libc = "0.2"
# The core's identity: ECDSA P-256 over `sidevoice-node-identity:<nonce>`, IEEE P1363 signatures.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
sha2 = "0.10"
base64 = "0.22"
# Nonces and the proxy's per-launch secret.
getrandom = "0.3"
# The proxy's secret compared in constant time.
subtle = "2.6"
# The install (docs/LOCAL_HOST.md → Install): the npm package is a gzipped tar, read entry by entry and written by hand
# (`tarball`). Both already in the app's tree (tauri-plugin-updater, sidevoice-engine); pure Rust.
flate2 = "1"
tar = { version = "0.4", default-features = false }
# The registry over HTTPS, blocking (`fetch` only): the reqwest, TLS stack (rustls, the platform's verifier) and system
# proxy the engine's model downloads and the app's updater already use; only its `blocking` client is added.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "system-proxy"], optional = true }

[dev-dependencies]
sidevoice-desktop-test-support = { path = "../../test-support" }
tempfile = "3"
