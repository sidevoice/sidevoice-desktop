[package]
name = "sidevoice-local-host"
version = "0.1.0"
description = "The local host (docs/LOCAL_HOST.md): this computer's core reached over its private local channel, paired by the app, its state, and the proxy the bundled page talks to. Blocking IO, no Tauri; what differs per OS is in `platform`."
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[features]
# The install's real HTTPS client (`npm::Https`): the app turns it on. Off for this crate's own tests, which use the
# stand-in registry, so they build with no TLS stack.
fetch = ["dep:reqwest"]

[dependencies]
# `D`, the local data directory, by the one rule every Sidevoice program shares, and the endpoint records the core
# and the connector publish in it (`ipc::Endpoint`): at the tag of a core release.
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.12.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The computer's kernel hostname, used when naming the core's local pairing.
gethostname = "1.1"
# The local channel (`platform::ipc`): Unix sockets and Windows named pipes behind one blocking API, and the peer's
# credentials; the crate `sidevoice_platform::ipc` is built on, already in the tree.
interprocess = "2.4"
# A run as a tree of its own (`platform::process`): a process group on Unix, a Job Object with no console window on
# Windows (the shared `spawn_tree`'s wrappers); already in the tree through sidevoice-platform.
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
# The install's scratch directory: a fresh name below the temporary directory, taken only if nobody has it, created
# private by `sidevoice_platform::fs` (`install::Scratch`); already in the tree.
tempfile = "3"
# The core's identity: ECDSA P-256 over `sidevoice-node-identity:<nonce>`, IEEE P1363 signatures.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
sha2 = "0.10"
base64 = "0.22"
# Nonces and the proxy's per-launch secret.
getrandom = "0.3"
# The proxy's secret compared in constant time.
subtle = "2.6"
# The install (docs/LOCAL_HOST.md → Install): the npm package is a gzipped tar, read entry by entry and written by hand
# (`tarball`). Both already in the app's tree (tauri-plugin-updater, sidevoice-engine); pure Rust.
flate2 = "1"
tar = { version = "0.4", default-features = false }
# The registry over HTTPS, blocking (`fetch` only): the reqwest, TLS stack (rustls, the platform's verifier) and system
# proxy the engine's model downloads and the app's updater already use; only its `blocking` client is added.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "system-proxy"], optional = true }

# Unix (`platform`): this process's effective uid, signal 0 to ask whether a process exists, and `poll` on a child's
# pipes, with no `unsafe` of ours; already in the tree through sidevoice-platform.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "event"] }

# Windows (`platform`): the user SID of a process, and whether one is running (`sysinfo`, as `sidevoice_platform::ipc`
# checks its pipe peers); a file's volume serial number and index (`winapi-util`); the process creation flag type
# `process-wrap` takes, cancelling a pipe's I/O and peeking at a child's pipes (`windows`). All already in the tree
# through sidevoice-platform.
[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
winapi-util = "0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
sidevoice-desktop-test-support = { path = "../../test-support" }
