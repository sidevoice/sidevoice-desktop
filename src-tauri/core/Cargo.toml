[package]
name = "sidevoice-desktop-core"
version = "0.2.0"
description = "The desktop app's pure logic: settings, the bridge contract, media permissions. No Tauri, so it is tested anywhere."
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
# A voice call's take reaches the page with its samples in base64 (src/voice/take.rs).
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[dev-dependencies]
# The parser the app registers shortcuts with (tauri-plugin-global-shortcut): the tests check what the web sends
# against it.
global-hotkey = "0.8"
