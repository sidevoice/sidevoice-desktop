[package]
name = "sidevoice-desktop"
version = "0.6.0"
description = "Sidevoice desktop client: a native shell around the Sidevoice web UI"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[lib]
name = "sidevoice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# CI only (src/probe.rs): the probe page and the switch that loads it, and what the call host shows of itself.
# Never in a release build.
probe = ["sidevoice-shared/probe"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Shared paths, held-directory storage, authenticated channels, detached helper execution and browser-data removal.
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.16.1" }
sidevoice-desktop-core = { path = "../core" }
sidevoice-shared = { path = "../../shared/core" }
sidevoice-shared-tauri = { path = "../../shared/tauri" }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The system's preferred languages, for the app's native texts (core i18n).
sys-locale = "0.3"
# Match the registered NSIS executable by native file identity (also handles Windows path casing).
same-file = "1"
# The local data folder Tauri gives the webview (`app_local_data_dir`), for its storage removal; already in Tauri's graph.
dirs = "7"
# The app-data deletion's check of the account home before it is held (platform/app_data.rs): its canonical path
# without Windows verbatim prefixes, and that it is not a volume's root.
dunce = "1"
file-id = "0.2"
# Probe-only RSS observations use the maintained portable API; no GPU estimates.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Friendly computer names via the OS APIs (platform/host); already in the shared platform graph.
whoami = "2.1"
url = "2.5"
# The app's updates (src/updater.rs; docs/BRIDGE.md → "The updater"), from Rust only: the page gets none of its
# commands. Its checks sleep on the app's Tokio runtime.
tauri-plugin-updater = "2.13"
# The call runs on this runtime too (sidevoice-shared).
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "net", "io-util", "process", "macros"] }
# A one-use helper capability, delivered only through its inherited stdin pipe.
getrandom = "0.3"
# The app log file (src/lib.rs `open_log_file`): its rotating, size-capped file in the platform's log directory, fed by the subscriber, and the room page's `log` command
# (shared/tauri/js/webview-log.js). The plugin installs no logger.
tauri-plugin-log = "2"
# The system privacy pages, from Rust only: the opener plugin the app registers (the microphone's, sidevoice-shared-tauri).
tauri-plugin-opener = "2"
log = "0.4"
# Events and spans (sidevoice-shared installs the subscriber, `logging::init`).
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
# This computer's own core, its pairing and the page's proxy (src/local_host.rs; docs/LOCAL_HOST.md), on every OS: the
# crate's `platform` speaks a Unix socket or a Windows named pipe.
# `fetch`: its install's HTTPS client, for "Prepare this computer" (docs/LOCAL_HOST.md → Install).
sidevoice-local-host = { path = "../local-host", features = ["fetch"] }

[target.'cfg(unix)'.dependencies]
# The account home the user database records, and what this user may change in a directory on the way to it
# (platform/account/unix.rs: `access`), never `HOME`; whether a browser writer has exited (signal zero,
# platform/webview_data/{linux,macos}.rs) and this user's launchd domain (platform/connector_service/macos.rs);
# already in the graph.
nix = { version = "0.31", default-features = false, features = ["user", "fs", "signal"] }

[target.'cfg(windows)'.dependencies]
# Pause and resume through the system media controls, lower through each app's audio session (platform/media_duck/windows.rs);
# already in the graph through cpal and the webview.
windows = { version = "0.62", features = ["Foundation", "Media_Control", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
regex = "1"
# The Task Scheduler task list (`schtasks /FO CSV`) read as CSV, quoting decoded (platform/connector_service/windows.rs).
csv = "1"
# The taskbar's colour, to draw the tray mark in the brand's look for it (src/tray.rs).
winreg = "0.55"
# Whether a mouse button went down elsewhere, to close the call controls card's panels, and whether the room is on another
# virtual desktop (DWM cloaked), for the card (src/call_controls.rs). The profile folder the system records for the account
# (platform/account/windows.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_UI_Shell", "Win32_System_Com", "Win32_Globalization", "Win32_System_StationsAndDesktops"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Process taps, aggregate devices and their IOProc, to lower one app at a time (platform/media_duck/macos_taps.rs); already
# in the graph through cpal, as are the types and Core Foundation crates it uses.
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFDictionary"] }
# Whether the app may send Apple events to Music and Spotify, without asking mid-call (platform/media_duck/macos.rs).
objc2-core-services = "0.3"
# The typed Mach bindings (task_info, task_vm_info) for the process memory read (src/platform/diagnostics/macos.rs).
mach2 = "0.6"
libc = "0.2"

# The call controls card as a non-activating panel: over full-screen apps, on every Space, never taking focus
# (src/call_controls.rs).
tauri-nspanel = "2.1"
# The Objective-C runtime and Foundation, for the confirmation, the card, the uninstall and the diagnostics.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSValue", "NSError", "NSObject", "NSArray", "NSRunLoop", "NSUUID", "block2"] }
# The native confirmation acknowledges startup from AppKit's modal run-loop mode.
# `NSEvent`: the app hearing the keys of its own windows, to record a shortcut with Fn in it (platform/key_capture/macos.rs).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "block2"] }
# CoreGraphics values used by the call controls card (src/call_controls.rs).
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
# MPRIS over the session bus (platform/media_duck/linux.rs); already in the graph through the keyring and the opener.
zbus = "5"
libc = "0.2"
# Tauri's existing native toolkit; explicit Cancel default/response for destructive confirmations.
gtk = "0.18"

[dev-dependencies]
# The recorded-speech fixture the voice memory measurement runs the call on (src/voice/memory.rs).
sidevoice-shared = { path = "../../shared/core", features = ["probe"] }
# Portable pairing attack fixtures from the pinned shared filesystem interface.
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.16.1", features = ["test-support"] }
# The native fake connector the reset's connector step runs in its tests (`data::connector_cli_tests`).
sidevoice-desktop-test-support = { path = "../../test-support" }
# Deterministic startup-deadline tests; no wall-clock sleeps.
tokio = { version = "1", features = ["rt", "test-util"] }
# Mock runtime for the platform interface tests; no native explorer is opened.
tauri = { version = "2.12", features = ["test"] }
tempfile = "3"
