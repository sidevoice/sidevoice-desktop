<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Fake room (CI)</title></head>
<body>
<p>A stand-in for the room, used by CI to prove the bridge works inside the real webview.</p>
<script>
// Mirrors the two seams the real web UI publishes (docs/BRIDGE.md): the store and the actions.
// The title carries what this webview offers the in-browser models, so CI can log it.
(async () => {
  let gpu = "none";
  try {
    const adapter = navigator.gpu ? await navigator.gpu.requestAdapter() : null;
    gpu = adapter ? "adapter" : navigator.gpu ? "api-without-adapter" : "none";
  } catch (e) { gpu = "error"; }
  const diag = [
    "webgpu=" + gpu,
    "wasm=" + (typeof WebAssembly === "object"),
    "getUserMedia=" + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    "audioWorklet=" + (typeof AudioWorkletNode === "function"),
    "secure=" + window.isSecureContext,
    "desktopHost=" + !!(window.__sidevoiceDesktop && window.__sidevoiceDesktop.host),
  ].join(" ");
  let state = { call: { joined: false, busy: false }, mic: { enabled: true, disabled: false }, title: diag };
  const listeners = new Set();
  const store = {
    getState: () => state,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
  };
  const set = (next) => { state = { ...state, ...next }; listeners.forEach((fn) => fn(state)); };
  window.sidevoiceActions = {
    toggleMic() { set({ mic: { ...state.mic, enabled: !state.mic.enabled } }); },
    async toggleCall() { set({ call: { joined: !state.call.joined, busy: false } }); },
  };
  window.sidevoiceUI = { store };
  // Then a call starts, as if the person had clicked "Entrar en la sala", and asks for the
  // microphone the way the room does. On a CI runner nobody answers macOS's own prompt, so the
  // outcome is informational; the app logs its own per-origin decision separately.
  setTimeout(async () => {
    await window.sidevoiceActions.toggleCall();
    let mic;
    try {
      const stream = await Promise.race([
        navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true }, video: false }),
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 15000)),
      ]);
      mic = "granted:" + stream.getAudioTracks().length;
      stream.getTracks().forEach((t) => t.stop());
    } catch (e) {
      mic = (e && (e.name || e.message)) || String(e);
    }
    set({ title: diag + " mic=" + mic });
  }, 1500);
})();
</script>
</body>
</html>
