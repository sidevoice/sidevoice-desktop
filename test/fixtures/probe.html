<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Sidevoice · sonda (CI)</title></head>
<body>
<p>CI only, served only by the app built with the <code>probe</code> feature (src-tauri/src/probe.rs): loaded into
the room window with SIDEVOICE_DEBUG=1 SIDEVOICE_DEBUG_PAGE=probe.html, to measure
what the interface's own window offers — same origin, same permission rule — and print it through debug_log.</p>
<script>
(async () => {
  const say = (line) => window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe " + line });
  const facts = [];
  facts.push("origin=" + location.protocol + "//" + location.host);
  facts.push("secure=" + window.isSecureContext);
  // Pairing verifies the node's identity with WebCrypto ECDSA P-256 (sidevoice-core `control/devices.py`).
  try {
    const keys = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
    const data = new TextEncoder().encode("sidevoice-node-identity:probe");
    const signature = await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, keys.privateKey, data);
    const spki = await crypto.subtle.exportKey("spki", keys.publicKey);
    const imported = await crypto.subtle.importKey("spki", spki, { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
    const ok = await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, imported, signature, data);
    facts.push("ecdsa=" + ok);
  } catch (error) {
    facts.push("ecdsa=error:" + (error && error.name));
  }
  try {
    const adapter = navigator.gpu ? await navigator.gpu.requestAdapter() : null;
    facts.push("webgpu=" + (adapter ? "adapter" : navigator.gpu ? "api-without-adapter" : "none"));
  } catch (error) {
    facts.push("webgpu=error");
  }
  facts.push("wasm=" + (typeof WebAssembly === "object"));
  facts.push("audioWorklet=" + (typeof AudioWorkletNode === "function"));
  try {
    const stream = await Promise.race([
      navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true }, video: false }),
      new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 15000)),
    ]);
    facts.push("mic=granted:" + stream.getAudioTracks().length);
    stream.getTracks().forEach((t) => t.stop());
  } catch (error) {
    facts.push("mic=" + ((error && (error.name || error.message)) || String(error)));
  }
  await say(facts.join(" "));

  // A node on this machine, as a paired interface reaches it: cross-origin from the app's origin to plain http on
  // loopback, with the device token in Authorization (which makes WebKit send a CORS preflight first).
  try {
    const answer = await fetch("http://127.0.0.1:8768/api/presentation/echo", {
      headers: { Authorization: "Bearer probe-token", accept: "application/json" },
    });
    const echoed = await answer.json();
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-loopback " + answer.status + " " + echoed.authorization });
  } catch (error) {
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-loopback error " + String(error && (error.name || error)) });
  }

  // A call as the bridge reports one: the app becomes the Now Playing app and installs the AirPods handler
  // (src/headset.rs), then the call ends. The log shows what was switched on; a wrong Objective-C call would crash.
  const call = (joined, micEnabled) => window.__TAURI_INTERNALS__.invoke("bridge_state", { snapshot: {
    version: 1, ready: true, joined, busy: false, micEnabled, micDisabled: false, title: "Sonda" } });
  try {
    await call(true, true); await new Promise((r) => setTimeout(r, 500));
    await call(true, false); await new Promise((r) => setTimeout(r, 500));
    await call(false, true); await new Promise((r) => setTimeout(r, 500));
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-headset ok" });
  } catch (error) {
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-headset error " + String(error && (error.message || error)) });
  }

  // What this build is, and its updates (docs/BRIDGE.md → "The build", "The updater"): the probe app is a dev build, so
  // `host.build` says so and the page has no `host.updater`; its commands refuse.
  try {
    const host = window.__sidevoiceDesktop.host;
    const status = await window.__TAURI_INTERNALS__.invoke("updater_status").then(() => "answered", (error) => error && error.key);
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-build ok build=" + JSON.stringify(host.build) +
      " updater=" + ("updater" in host) + " status=" + status });
  } catch (error) {
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-build error " + String(error && (error.message || error)) });
  }

  // The native engine through the app itself, as the interface calls it (docs/BRIDGE.md): capabilities, installs as
  // sidevoice-web's `ModelCatalogs.install(model, {build, engine, onProgress, signal})` — by a catalogue build id, by an
  // engine, by nothing (the recommended build) —, refusals by key, the machine's memory, a download cancelled by its
  // signal.
  const engine = window.__sidevoiceDesktop && window.__sidevoiceDesktop.host && window.__sidevoiceDesktop.host.engine;
  if (!engine) { await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-engine none" }); return; }
  async function until(check, ms) {
    const end = Date.now() + ms;
    for (;;) {
      const value = await check();
      if (value) return value;
      if (Date.now() > end) throw new Error("timed out");
      await new Promise((r) => setTimeout(r, 250));
    }
  }
  try {
    const capabilities = await engine.capabilities();
    let progress = 0;
    await engine.install("kokoro-82m-v1.0", { engine: "sherpa-onnx", onProgress: () => { progress++; } });
    // As the web's settings do: the build the person chose, by its catalogue id and its engine.
    const tiny = (await engine.catalogs())[0].models.find((m) => m.id === "whisper-tiny");
    const tinyBuild = tiny.builds.find((b) => b.backend === "whisper-cpp" && b.available);
    await engine.install("whisper-tiny", { build: tinyBuild.id, engine: tinyBuild.backend });
    await engine.install("silero-vad");
    const installed = (await engine.installed()).map((b) => b.model + "@" + b.engine).sort().join(",");
    // A page engine is never installed natively, nor replaced by another: refused, by key (docs/BRIDGE.md → "Refusals").
    const refused = await engine.install("whisper-tiny", { engine: "transformers-js" })
      .then(() => "no", (error) => (error && error.key === "engine_unsupported" ? "yes" : "other:" + JSON.stringify(error)));
    const memory = await engine.memory();

    // Cancel: a big download, its signal aborted once it is under way; the install rejects install-cancelled and
    // leaves nothing (CI then checks the disk). A signal already aborted rejects so without starting.
    let measured = null;
    let ended = false;
    const abort = new AbortController();
    // Aborted from its first report with bytes, as early as the page could, so a fast line cannot finish it first.
    const small = engine.install("whisper-small", { engine: "sherpa-onnx", signal: abort.signal,
      onProgress: (p) => { if (p.fraction > 0 && !measured) { measured = p; abort.abort(); } } });
    small.then(() => { ended = true; }, () => { ended = true; });
    await until(() => measured || ended, 120000);
    abort.abort();
    const outcome = await small.then(() => "installed", (error) => error && error.code + "/" + error.key);
    const smallGone = !(await engine.installed()).some((b) => b.model === "whisper-small");
    const event = measured
      ? Object.keys(measured).sort().join("+") + ":" + (measured.total > 0 && measured.done > 0 && measured.fraction <= 1)
      : "none";
    const aborted = new AbortController();
    aborted.abort();
    const preAborted = await engine.install("whisper-small", { engine: "sherpa-onnx", signal: aborted.signal })
      .then(() => "installed", (error) => error && error.code);

    // Removing a model through the app's own command: whisper-tiny, installed above, goes from the builds on disk and
    // from the catalogue (the engine reads both from its storage), then comes back for the voice call further down;
    // an unknown model is refused by key with the engine's code.
    const removed = await engine.uninstall("whisper-tiny").then((value) => String(value), (error) => "error:" + JSON.stringify(error));
    const tinyLeft = (await engine.installed()).some((b) => b.model === "whisper-tiny") ||
      (await engine.catalogs())[0].models.some((m) => m.id === "whisper-tiny" && (m.installed || m.builds.some((b) => b.installed)));
    const tinyGone = !tinyLeft;
    const unknown = await engine.uninstall("no-such-model")
      .then(() => "removed", (error) => (error && error.key) + ":" + (error && error.code));
    await engine.install("whisper-tiny", { build: tinyBuild.id, engine: tinyBuild.backend });
    const tinyBack = (await engine.installed()).some((b) => b.model === "whisper-tiny" && b.engine === tinyBuild.backend);
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-engine ok capabilities=" + JSON.stringify(capabilities) +
      " installed=" + installed + " progress_calls=" + progress + " refused=" + refused + " memory=" + JSON.stringify(memory) +
      " cancel=" + outcome + " pre_aborted=" + preAborted + " cancel_gone=" + smallGone + " progress_event=" + event +
      " uninstall=" + removed + "/" + tinyGone + "/" + unknown + "/" + tinyBack });
  } catch (error) {
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-engine error " + String(error && (error.message || error)) });
  }

  // The voice call the app runs (docs/BRIDGE.md → "The voice call"): the seam's shape, the engine's catalogues
  // (`host.engine`), settings that name a catalogue's model, a build of it and an end-of-turn model, as the web's settings
  // do, the audio devices, and a start that settles. A CI runner may have no microphone or
  // speaker: then the start is refused with the call's code, which is what the probe reports.
  const voice = window.__sidevoiceDesktop && window.__sidevoiceDesktop.host && window.__sidevoiceDesktop.host.voice;
  if (!voice) { await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-voice none" }); return; }
  try {
    const states = [];
    const errors = [];
    const stops = [voice.onState((s) => states.push(s.listening)), voice.onError((e) => errors.push(e.code))];
    const catalogs = await window.__sidevoiceDesktop.host.engine.catalogs();
    const models = catalogs[0].models;
    const remote = catalogs.slice(1).map((c) => c.id + ":" + (c.status.reason ? c.status.reason.code : "current")).join(",");
    const unknown = await voice.setSettings({ stt: { catalog: "local", model: "whisper-nope" },
      tts: { catalog: "local", model: "kokoro-82m-v1.0" } }).then(() => "no", (error) => error && error.key + "/" + error.code);
    // A build that is not the model's is refused; one that runs here is loaded, and so is the end-of-turn model chosen
    // (the last that runs here: with several, not the one the app would take anyway).
    const badBuild = await voice.setSettings({ stt: { catalog: "local", model: "whisper-tiny", build: "whisper-tiny/nope" },
      tts: { catalog: "local", model: "kokoro-82m-v1.0" } }).then(() => "no", (error) => error && error.key + "/" + error.code);
    const tiny = models.find((m) => m.id === "whisper-tiny");
    // One the catalogue would not pick on its own when there is such a build.
    const runnable = tiny ? tiny.builds.filter((b) => b.available) : [];
    const build = (runnable.find((b) => b.id !== tiny.recommendedBuild) || runnable[0] || { id: "none" }).id;
    const turns = models.filter((m) => m.capabilities.includes("end-of-turn") && m.builds.some((b) => b.available));
    const turnModel = turns.length ? turns[turns.length - 1].id : "none";
    await voice.setSettings({ stt: { catalog: "local", model: "whisper-tiny", language: "es", build },
      tts: { catalog: "local", model: "kokoro-82m-v1.0", voice: "ef_dora", speed: 1 }, patience: "fast",
      end_of_turn: "smart-turn", turn_model: turnModel, idle_unload_minutes: 10 });
    // The system's devices (a runner may list none) and an id it does not list, refused by key and code.
    const listed = await voice.audioDevices();
    const devices = listed.inputs.length + "/" + listed.outputs.length + "/" + listed.outputSelectable;
    const unknownDevice = await voice.setAudioDevices({ input: "nowhere:nothing" })
      .then(() => "no", (error) => error && error.key + "/" + error.code);
    const started = await voice.start().then(() => "ok", (error) => error.key + "/" + error.code);
    await voice.stop();
    await until(() => states.includes("idle") || started !== "ok", 30000);
    stops.forEach((stop) => stop());
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-voice ok keys=" + Object.keys(voice).length +
      " catalogs=" + catalogs[0].id + "," + remote + " models=" + models.length + " vad=" + models.some((m) => m.capabilities.includes("vad")) + " unknown=" + unknown +
      " bad_build=" + badBuild + " build=" + build + " turn_model=" + turnModel +
      " devices=" + devices + " unknown_device=" + unknownDevice + " start=" + started + " states=" + states.join(",") + " errors=" + errors.join(",") });
  } catch (error) {
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-voice error " + String(error && (error.message || error)) });
  }
})();
</script>
</body>
</html>
