<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Sidevoice · sonda (CI)</title></head>
<body>
<p>CI only, served only by the app built with the <code>probe</code> feature (src-tauri/src/probe.rs): loaded into
the room window with SIDEVOICE_DEBUG=1 SIDEVOICE_DEBUG_PAGE=probe.html, to measure
what the interface's own window offers — same origin, same permission rule — and print it through debug_log.</p>
<script>
(async () => {
  const say = (line) => window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe " + line });
  const facts = [];
  facts.push("origin=" + location.protocol + "//" + location.host);
  facts.push("secure=" + window.isSecureContext);
  // Pairing verifies the node's identity with WebCrypto ECDSA P-256 (sidevoice-core `control/devices.py`).
  try {
    const keys = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
    const data = new TextEncoder().encode("sidevoice-node-identity:probe");
    const signature = await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, keys.privateKey, data);
    const spki = await crypto.subtle.exportKey("spki", keys.publicKey);
    const imported = await crypto.subtle.importKey("spki", spki, { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
    const ok = await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, imported, signature, data);
    facts.push("ecdsa=" + ok);
  } catch (error) {
    facts.push("ecdsa=error:" + (error && error.name));
  }
  try {
    const adapter = navigator.gpu ? await navigator.gpu.requestAdapter() : null;
    facts.push("webgpu=" + (adapter ? "adapter" : navigator.gpu ? "api-without-adapter" : "none"));
  } catch (error) {
    facts.push("webgpu=error");
  }
  facts.push("wasm=" + (typeof WebAssembly === "object"));
  facts.push("audioWorklet=" + (typeof AudioWorkletNode === "function"));
  try {
    const stream = await Promise.race([
      navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true }, video: false }),
      new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 15000)),
    ]);
    facts.push("mic=granted:" + stream.getAudioTracks().length);
    stream.getTracks().forEach((t) => t.stop());
  } catch (error) {
    facts.push("mic=" + ((error && (error.name || error.message)) || String(error)));
  }
  await say(facts.join(" "));

  // A node on this machine, as a paired interface reaches it: cross-origin from the app's origin to plain http on
  // loopback, with the device token in Authorization (which makes WebKit send a CORS preflight first).
  try {
    const answer = await fetch("http://127.0.0.1:8768/api/presentation/echo", {
      headers: { Authorization: "Bearer probe-token", accept: "application/json" },
    });
    const echoed = await answer.json();
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-loopback " + answer.status + " " + echoed.authorization });
  } catch (error) {
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-loopback error " + String(error && (error.name || error)) });
  }

  // A call as the bridge reports one: the app becomes the Now Playing app and installs the AirPods handler
  // (src/headset.rs), then the call ends. The log shows what was switched on; a wrong Objective-C call would crash.
  const call = (joined, micEnabled) => window.__TAURI_INTERNALS__.invoke("bridge_state", { snapshot: {
    version: 1, ready: true, joined, busy: false, micEnabled, micDisabled: false, title: "Sonda" } });
  try {
    await call(true, true); await new Promise((r) => setTimeout(r, 500));
    await call(true, false); await new Promise((r) => setTimeout(r, 500));
    await call(false, true); await new Promise((r) => setTimeout(r, 500));
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-headset ok" });
  } catch (error) {
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-headset error " + String(error && (error.message || error)) });
  }

  // The native engine through the app itself, as the interface calls it (docs/BRIDGE.md): capabilities, install,
  // run by catalogue model id + engine — hardened runtime, sidevoice-engine linked into the app, raw-byte IPC.
  const engine = window.__sidevoiceDesktop && window.__sidevoiceDesktop.host && window.__sidevoiceDesktop.host.nativeEngine;
  if (!engine) { await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-engine none" }); return; }
  try {
    const capabilities = await engine.capabilities();
    let progress = 0;
    await engine.install("kokoro-82m-v1.0", "sherpa-onnx", () => { progress++; });
    await engine.install("whisper-tiny", "sherpa-onnx");
    const installed = (await engine.installed()).map((b) => b.model + "@" + b.engine).sort().join(",");
    const started = performance.now();
    const audio = await engine.synthesize("kokoro-82m-v1.0", "sherpa-onnx", "ef_dora", 1, "Hola, esto es una prueba de voz.");
    const spoken = performance.now() - started;
    const text = await engine.transcribe("whisper-tiny", "sherpa-onnx", audio.samples, audio.sampleRate, "es", "cpu");
    // A page engine is never run natively, nor replaced by another: refused, by key (docs/BRIDGE.md → "Refusals").
    const refused = await engine.transcribe("whisper-tiny", "transformers-js", audio.samples, audio.sampleRate, "es")
      .then(() => "no", (error) => (error && error.key === "engine_unsupported" ? "yes" : "other:" + JSON.stringify(error)));

    // Load → transcribe → unload, as the interface selects a model (sidevoice-core#21 phase 3), then D13 with this app's idle time
    // shortened (SIDEVOICE_DEBUG_IDLE_UNLOAD_SECS): unloaded once the call ends and the time passes, loaded again as
    // the next call connects. In a call meanwhile, so nothing is unloaded under the checks.
    const names = (list) => list.map((l) => l.model + "@" + l.engine + "/" + l.accelerator).sort().join(",");
    const resident = async () => names(await engine.loaded());
    async function until(check, ms) {
      const end = Date.now() + ms;
      for (;;) {
        const value = await check();
        if (value) return value;
        if (Date.now() > end) throw new Error("timed out; loaded=" + (await resident()));
        await new Promise((r) => setTimeout(r, 250));
      }
    }
    await call(true, true);
    await engine.unload("whisper-tiny", "sherpa-onnx");
    const before = await resident();
    const load = await engine.load("whisper-tiny", "sherpa-onnx", "cpu");
    const again = await engine.load("whisper-tiny", "sherpa-onnx", "cpu");
    const loaded = await engine.loaded();
    const afterLoad = names(loaded);
    const english = await engine.synthesize("kokoro-82m-v1.0", "sherpa-onnx", "af_heart", 1, "Hello, this is a voice test.");
    const heardEnglish = await engine.transcribe("whisper-tiny", "sherpa-onnx", english.samples, english.sampleRate, "en", "cpu");
    const sameModels = (await resident()) === afterLoad;
    await engine.unload("whisper-tiny", "sherpa-onnx");
    const afterUnload = await resident();
    const memory = await engine.memory();
    await engine.load("whisper-tiny", "sherpa-onnx", "cpu");
    await call(false, true); // the last one leaves: the idle time starts
    const idleStarted = Date.now();
    await until(async () => (await engine.loaded()).length === 0, 60000);
    const idleMs = Date.now() - idleStarted;
    await call(true, true); // the next call connects
    const preloaded = await until(async () => { const r = await resident(); return r.split(",").length === 2 && r; }, 60000);
    await call(false, true);

    // Cancel: a big download, cancelled once its speed is measured; the install rejects by key and leaves nothing
    // (CI then checks the disk).
    let measured = null;
    let ended = false;
    const small = engine.install("whisper-small", "sherpa-onnx", (p) => { if (p.bytes_per_s && !measured) measured = p; });
    small.then(() => { ended = true; }, () => { ended = true; });
    await until(() => measured || ended, 120000);
    const cancelled = await engine.cancel(small.job);
    const outcome = await small.then(() => "installed", (error) => error && error.key);
    const cancelAgain = await engine.cancel(small.job);
    const smallGone = !(await engine.installed()).some((b) => b.model === "whisper-small");
    const event = measured ? Object.keys(measured).sort().join("+") + ":" + (measured.job === small.job && measured.model === "whisper-small") : "none";

    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-engine ok capabilities=" + JSON.stringify(capabilities) +
      " installed=" + installed + " progress_calls=" + progress + " refused=" + refused +
      " audio=" + (audio.samples.length / audio.sampleRate).toFixed(2) + "s@" + audio.sampleRate + " synth_ms=" + Math.round(spoken) +
      " before_load=" + before + " load_ms=" + load.load_ms + " load_again_ms=" + again.load_ms + " loaded=" + afterLoad +
      " since_ok=" + loaded.every((l) => l.since > 1.7e12 && l.last_used >= l.since) +
      " same_models=" + sameModels + " unloaded=" + afterUnload + " memory=" + JSON.stringify(memory) +
      " idle_unloaded_ms=" + idleMs + " preloaded=" + preloaded +
      " cancel=" + cancelled + "/" + outcome + "/" + cancelAgain + " cancel_gone=" + smallGone + " progress_event=" + event +
      " speed=" + (measured ? measured.bytes_per_s : 0) + " cancelled_at=" + (measured ? measured.done + "/" + measured.total : "") +
      " text=" + JSON.stringify(text) + " text_en=" + JSON.stringify(heardEnglish) });
  } catch (error) {
    await window.__TAURI_INTERNALS__.invoke("debug_log", { line: "probe-engine error " + String(error && (error.message || error)) });
  }
})();
</script>
</body>
</html>
