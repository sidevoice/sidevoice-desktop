[package]
name = "sidevoice-app-tauri"
version = "0.3.0"
description = "The commands every Sidevoice app shares, as one Tauri plugin over sidevoice-app-core's application host: the caller check, the arguments, and nothing of what the commands do."
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
# A Tauri plugin's permissions are named by its package, and cargo needs the key to hand them to the app that uses it.
links = "sidevoice-app-tauri"

[build-dependencies]
# Writes a permission for each command (permissions/autogenerated/), which an app's capabilities grant.
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
sidevoice-app-core = { path = "../app-core" }
tauri = { version = "2.12" }
serde_json = "1"

[dev-dependencies]
# The mock runtime the commands' authorization is tested on.
tauri = { version = "2.12", features = ["test"] }
# The ACL the plugin's own permission files and a capability make, which the mock runtime then enforces (src/ipc_tests.rs).
tauri-utils = "2"
toml = "1"
