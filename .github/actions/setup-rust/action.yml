name: Set up Rust and the native engine's libraries
description: >-
  The desktop app's Rust setup (the mobile product's jobs have their own). Installs the Rust toolchain
  desktop/rust-toolchain.toml pins, restores the Rust build cache (the repository's workspace
  and xtask/), and fetches the sherpa-onnx static libraries that sidevoice-engine links with `cargo xtask sherpa-libs`
  (that engine's own command, at the
  commit Cargo.lock pins): checked against the digests it pins, kept outside target/ and linked through
  SHERPA_ONNX_LIB_DIR (which the command exports), so no build script downloads anything unchecked.
  Both caches are written only by a push to main (the nightly, and a release: release-please runs on one); a pull
  request or a manual run only restores them, so its caches never evict main's from the repository's 10 GB.

inputs:
  cache:
    description: >-
      The Rust build cache, by name: one that several jobs building the same dependencies share. Empty (the default):
      this job's own.
    required: false
    default: ''
  save-cache:
    description: >-
      Whether this job writes the build cache when it found none for this Cargo.lock, on a push to main (no other run
      writes it): 'false' for a job that only reads a shared cache another job (the one that builds all of it) writes.
    required: false
    default: 'true'

outputs:
  engine-rev:
    description: The sidevoice-engine commit Cargo.lock pins (`cargo xtask engine-rev`).
    value: ${{ steps.engine.outputs.rev }}

runs:
  using: composite
  steps:
    - name: Toolchain (desktop/rust-toolchain.toml)
      shell: bash
      working-directory: desktop
      run: |
        set -euo pipefail
        rustup toolchain install
        rustc --version
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          .
          xtask
        # Every cache of this action starts with `desktop`, so no other product's can be taken for one of these (RELEASING.md →
        # "CI caches"). `key` is read only when there is no `shared-key`, which then carries the name itself.
        key: desktop
        shared-key: ${{ inputs.cache && format('desktop-{0}', inputs.cache) || '' }}
        save-if: ${{ inputs.save-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    - name: The engine at the commit Cargo.lock pins
      id: engine
      shell: bash
      run: |
        set -euo pipefail
        REV=$(cargo xtask engine-rev)
        echo "rev=$REV" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      id: sherpa
      with:
        path: ~/.cache/sidevoice-engine/sherpa-onnx
        # By the engine's commit: its xtask/sherpa-onnx-libs.json is outside the workspace, where hashFiles cannot see.
        key: sherpa-onnx-libs-desktop-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine.outputs.rev }}
    - name: sherpa-onnx's libraries (cargo xtask sherpa-libs)
      shell: bash
      run: cargo xtask sherpa-libs
    # What the step above fetched and checked against the engine's digests; on a push to main only.
    - if: steps.sherpa.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/sidevoice-engine/sherpa-onnx
        key: ${{ steps.sherpa.outputs.cache-primary-key }}
