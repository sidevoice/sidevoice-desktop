name: mobile

# The mobile app (mobile/, docs/MOBILE.md), built unsigned on every pull request: an Android APK and an iOS app for the
# simulator, and the check that the committed native projects (mobile/tauri/gen) are what the Tauri CLI writes from the app's
# inputs (generator model G-a). Nothing here signs or uploads anything and no job sees a secret: signing is its own
# workflow, run by hand from main. It is a workflow of its own, so the desktop app's `build.yml` (its nightly and its
# release) neither waits for it nor is held up by it.
# Every step is a `cargo xtask mobile …` command (xtask/src/mobile.rs): this file sets up the machine and calls them.
# The Rust and Gradle caches are written only by a push to main, and their keys start with `mobile` (RELEASING.md →
# "CI caches"); a pull request only restores them.
# Every external action is pinned by its full commit SHA, with its version in a comment: a tag can be moved, and a moved one
# would run new code beside the build.
# Run by hand with `symbols-of-build: N`, it runs only `ios-symbols`: the symbols of TestFlight build N, for a build made
# before mobile-testflight.yml kept them. Dispatch it on a ref whose app is the build's commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      symbols-of-build:
        description: "TestFlight build number: only rebuild that build's iOS archive, unsigned, for its symbols (run on the build's commit)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The bundled web interface is a release of sidevoice-web (web.pin.json): its attestation is verified wherever it is
  # fetched (`npm run web`, and every Tauri build through it), with gh and this run's token.
  SIDEVOICE_WEB_ATTESTATION: require
  GH_TOKEN: ${{ github.token }}

jobs:
  android:
    name: Android (unsigned APK)
    if: ${{ !inputs.symbols-of-build }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-android
      - name: The committed Android project is what the Tauri CLI writes (cargo xtask mobile generate android)
        run: cargo xtask mobile generated android
      - name: Clippy over the mobile crates, warnings denied (empty on a computer, so cargo xtask lint cannot reach them)
        run: cargo xtask mobile lint android
      - name: "The unsigned APK (universal: arm64-v8a and armeabi-v7a), and its native libraries' alignment to 16 KB pages (Google Play's rule)"
        if: ${{ !cancelled() }}
        run: cargo xtask mobile build android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: Sidevoice-android-unsigned-apk
          path: dist/*.apk
          retention-days: 7
          if-no-files-found: error
      # The Kotlin library's JVM tests, after the build has written the Gradle includes: the call service's sessions, and the
      # call notification drawn to PNG in every state (light, dark, mic on and off), the evidence to compare with the design.
      - name: "The Android library's JVM tests, and the call card's renders (cargo xtask mobile test android)"
        if: ${{ !cancelled() }}
        run: cargo xtask mobile test android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: Sidevoice-android-call-card-renders
          path: dist/android-call-card
          retention-days: 14
          if-no-files-found: error

  ios:
    name: iOS (simulator app)
    if: ${{ !inputs.symbols-of-build }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust, as mobile/rust-toolchain.toml says (the toolchain and the four mobile targets)
        working-directory: mobile
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            xtask
          prefix-key: v1-rust-mobile
          shared-key: ios
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The Tauri CLI renders the Xcode project with XcodeGen.
      - name: XcodeGen
        run: command -v xcodegen || brew install xcodegen
      # The call's Live Activity: every state drawn to PNG by its Swift package's tests on a simulator (Lock Screen card in
      # light and dark, the Dynamic Island's expanded, compact and minimal views), the evidence a pull request shows beside
      # the design's gallery. It needs only Xcode, so it runs before the app's long build.
      - name: "The call's Live Activity, every state rendered to PNG"
        run: cargo xtask mobile renders ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: Sidevoice-ios-live-activity-renders
          path: dist/live-activity
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ !cancelled() }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: ${{ !cancelled() }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() }}
        with:
          path: target/web
          key: web-${{ hashFiles('web.pin.json', 'scripts/build-web.mjs', 'scripts/web-release.mjs') }}
      - name: The committed iOS project is what the Tauri CLI writes (cargo xtask mobile generate ios)
        id: generated
        if: ${{ !cancelled() }}
        run: cargo xtask mobile generated ios
      # What the CLI wrote, to commit when a change of an input or of the CLI meant it should have been regenerated.
      - name: The project the CLI wrote
        if: ${{ failure() && steps.generated.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-gen-apple
          path: mobile/tauri/gen/apple
          include-hidden-files: true
          retention-days: 7
      - name: The app for the simulator, unsigned
        if: ${{ !cancelled() }}
        run: cargo xtask mobile build ios
      - name: Clippy over the mobile crates, warnings denied (empty on a computer, so cargo xtask lint cannot reach them)
        if: ${{ !cancelled() }}
        run: cargo xtask mobile lint ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: Sidevoice-ios-simulator-app
          path: dist/*.zip
          retention-days: 7
          if-no-files-found: error
      # The app on a simulator of the biggest iPhone, in light and dark: a screenshot of what the screen really shows and the
      # app's own log (the layout lines of `platform::webview`). Evidence for a layout fault no code reading shows (a strip
      # of the screen the page does not cover); cheap, so it runs with the build.
      - name: The app on an iPhone Pro Max simulator, screenshots and log
        if: ${{ !cancelled() }}
        run: cargo xtask mobile screenshots ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: Sidevoice-ios-simulator-screenshots
          path: dist/simulator
          retention-days: 7
          if-no-files-found: error

  # The symbols of TestFlight build N (`symbols-of-build`): its device archive as mobile-testflight.yml makes it (the same
  # machine, toolchain, caches and command, `cargo xtask mobile symbols`), unsigned and not uploaded, so that the code is
  # laid out as in the build that shipped and its crash reports' offsets read in these symbols. No secret.
  ios-symbols:
    name: iOS symbols of a TestFlight build (by hand, symbols-of-build)
    if: ${{ inputs.symbols-of-build }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust, as mobile/rust-toolchain.toml says (the toolchain and the four mobile targets)
        working-directory: mobile
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            xtask
          prefix-key: v1-rust-mobile
          shared-key: ios
          save-if: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/web
          key: web-${{ hashFiles('web.pin.json', 'scripts/build-web.mjs', 'scripts/web-release.mjs') }}
      - name: The device archive, unsigned, and its symbols (cargo xtask mobile symbols)
        env:
          BUILD_NUMBER: ${{ inputs.symbols-of-build }}
        run: cargo xtask mobile symbols --build-number "$BUILD_NUMBER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Sidevoice-ios-${{ inputs.symbols-of-build }}-symbols
          path: dist/Sidevoice-ios-*-symbols.zip
          retention-days: 90
          if-no-files-found: error
