name: build

# What runs when (RELEASING.md):
# - pull request: lint + unit tests on Linux, and the Windows and Linux app builds (the repo is public: Actions
#   minutes are free); the Apple-Silicon native-engine jobs only when the engine, the bridge, the catalogue or the CI
#   probes change (`changes` below).
# - push to main, manual run: everything, installers included; a green run on main replaces the `nightly` pre-release.
# - a release (called by release-please.yml with the tag it created): everything, attached to that release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fixture:
        description: Check resource wiring with a pending-pin fixture; never publish or upload installers.
        type: boolean
        default: false
      r4-native-pair-candidate:
        description: Build one Mac app from exact pinned Rust Connector/Core source; no Desktop platform matrix or publication.
        type: boolean
        default: false
      r4-native-pair-operator-trial:
        description: Package a bounded Mac self-test artifact; skip changed-pair update and rollback acceptance, recording them as not run.
        type: boolean
        default: false
  workflow_call:
    inputs:
      release-tag:
        description: The draft release release-please created (vX.Y.Z); its assets are built from that tag.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Per ref. A release (github.workflow is the caller's, release-please) never shares a group with a push.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  R4_CONNECTOR_SOURCE_SHA: cdcc1a613d35bf600b8f39427195cbe4700ea6ec
  R4_PREVIOUS_CONNECTOR_SOURCE_SHA: c3aa3468e66e265897fdf0fccf5ad55d6fcf060f
  R4_CODEX_CLI_VERSION: '0.160.0'
  R4_CORE_SOURCE_SHA: b2ae125453baa3634b94eefcc49879588e3b6e40
  R4_CORE_LOCK_SHA256: b0e068cf34f5c1549c00add4c2d94e06af3758bb1586c2e58f192220a22b53e9

jobs:
  test:
    name: Lint and unit tests
    if: ${{ inputs.r4-native-pair-candidate != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - name: Webview toolkit (the shell links against it even to lint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Bridge script tests
        run: npm test
      - name: Real GitHub verifier CLI rejects unsigned connector provenance
        run: node --test test/attestation-cli.mjs
      - name: The icons, tray and .dmg window are what the brand files draw (npm run icons)
        run: |
          npm run icons
          git status --porcelain -- src-tauri/icons src-tauri/dmg ui/brand
          git diff --quiet --exit-code -- src-tauri/icons src-tauri/dmg ui/brand
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --locked --workspace
      - name: The local host with two users (a second uid cannot open local.sock, link as a connector, or use the proxy)
        working-directory: src-tauri
        run: |
          set -euo pipefail
          # src-tauri/local-host/examples/local-host-ci.rs: `serve` as this user (a stand-in core on local.sock, the
          # app's side paired with it, the proxy), `attack` as another.
          cargo build --locked -p sidevoice-local-host --example local-host-ci
          mkdir -p /tmp/svci && chmod 755 /tmp/svci
          TOOL=/tmp/svci/local-host-ci
          cp target/debug/examples/local-host-ci "$TOOL" && chmod 755 "$TOOL"
          sudo useradd --create-home sidevoice-other
          "$TOOL" serve /tmp/svci/d /tmp/svci/app /tmp/svci/port > /tmp/svci/serve.log 2>&1 &
          SERVE=$!
          for i in $(seq 1 50); do [ -s /tmp/svci/port ] && break; sleep 0.2; done
          PORT=$(cat /tmp/svci/port)
          ls -la /tmp/svci /tmp/svci/d
          echo "--- the second user"
          sudo -u sidevoice-other "$TOOL" attack /tmp/svci/d /tmp/svci/app "$PORT"
          echo "--- the same attempts as the first user (control: the socket and the files are open to it)"
          if "$TOOL" attack /tmp/svci/d /tmp/svci/app "$PORT"; then echo "the control got nowhere"; exit 1; fi
          kill "$SERVE"
          echo "--- serve"; cat /tmp/svci/serve.log
          # The second user's attempts never reached the core: it saw only the first user's requests.
          if grep -q "auth=other" /tmp/svci/serve.log; then echo "the core saw a foreign token"; exit 1; fi

  changes:
    name: What this run builds
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      # The Apple-Silicon engine round trip, the probe page and the room flow.
      native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native == 'true' }}
      engine: ${{ github.event_name != 'pull_request' || steps.filter.outputs.engine == 'true' }}
      card: ${{ github.event_name != 'pull_request' || steps.filter.outputs.card == 'true' }}
      # The .dmg: never on a pull request. (Windows and Linux build their installers on every run.)
      installers: ${{ github.event_name != 'pull_request' && !inputs.fixture && !inputs.r4-native-pair-candidate }}
      # Where the installers go: the release that called this, or the rolling `nightly` pre-release on a push to main.
      publish: ${{ inputs.release-tag && 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nightly' || '' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            native:
              - 'src-tauri/engine/**'
              - 'src-tauri/local-host/**'
              - 'src-tauri/src/local_host.rs'
              - 'src-tauri/src/headset.rs'
              - 'src-tauri/src/engine_ipc.rs'
              - 'src-tauri/src/probe.rs'
              - 'src-tauri/src/call_controls.rs'
              - 'src-tauri/core/src/call_controls.rs'
              - 'src-tauri/src/lib.rs'
              - 'src-tauri/build.rs'
              - 'src-tauri/capabilities/**'
              - 'src-tauri/permissions/**'
              - 'src-tauri/connector-pin.json'
              - 'src-tauri/tauri.macos-aarch64.conf.json'
              - 'src-tauri/tauri.conf.json'
              - 'src-tauri/core/src/engines.rs'
              - 'src-tauri/core/src/bridge.rs'
              - 'bridge/**'
              - 'scripts/**'
              - 'test/macos/**'
              - '.node-version'
              - 'rust-toolchain.toml'
              - 'src-tauri/Cargo.lock'
              - 'src-tauri/Cargo.toml'
              - 'package-lock.json'
              - 'package.json'
              - '.github/workflows/build.yml'
              - 'catalog/**'
              - 'test/connector-fixture.test.mjs'
              - 'test/fixtures/**'
              - 'ui/voice/**'
            engine:
              - 'src-tauri/engine/**'
              - 'src-tauri/core/src/engines.rs'
              - 'src-tauri/src/engine_ipc.rs'
              - 'src-tauri/src/headset.rs'
              - 'src-tauri/src/lib.rs'
              - 'src-tauri/src/probe.rs'
              - 'src-tauri/Cargo*'
              - 'bridge/**'
              - 'catalog/**'
              - 'ui/voice/**'
              - 'test/fixtures/**'
              - 'test/macos/**'
              - 'scripts/build*'
              - 'rust-toolchain.toml'
              - '.github/workflows/build.yml'
            card:
              - 'src-tauri/src/call_controls.rs'
              - 'src-tauri/core/src/call_controls.rs'
              - 'src-tauri/src/lib.rs'
              - 'src-tauri/src/probe.rs'
              - 'src-tauri/Cargo*'
              - 'bridge/**'
              - 'ui/voice/**'
              - 'test/fixtures/**'
              - 'test/macos/**'
              - 'scripts/build*'
              - 'rust-toolchain.toml'
              - '.github/workflows/build.yml'

  macos:
    name: macOS (Apple Silicon) package and focused integration
    needs: [changes, test]
    if: ${{ needs.changes.outputs.native == 'true' && inputs.r4-native-pair-candidate != true }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Read the declared connector input
        id: connector
        run: node -e 'const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "status=" + require("./src-tauri/connector-pin.json").status + "\n")'
      - name: Build the explicit fixture package (resource wiring only)
        if: (github.event_name == 'pull_request' || inputs.fixture) && steps.connector.outputs.status == 'pending'
        run: npm run build:mac:fixture
      - name: Build and verify the real app (the same command as a developer Mac)
        if: (github.event_name != 'pull_request' && !inputs.fixture) || steps.connector.outputs.status != 'pending'
        env:
          # The built-in token is restricted to this repository. A trusted manual/main run may use the
          # narrowly scoped cross-repository Actions: read token; never expose it to PR code.
          GH_TOKEN: ${{ github.token }}
          SIDEVOICE_GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SIDEVOICE_CONNECTOR_ACTIONS_READ || '' }}
        run: npm run build:mac
      - name: First open (no settings) — the bundled interface comes up in the real WKWebView
        if: needs.changes.outputs.installers == 'true'
        run: bash test/macos/first-open.sh
      - name: With a target (a fake node on loopback)
        if: needs.changes.outputs.installers == 'true'
        run: bash test/macos/target.sh
      - name: Make the .dmg (the brand's window, with background, icon layout and volume icon)
        if: needs.changes.outputs.installers == 'true'
        run: bash test/macos/package-dmg.sh
      - name: The .dmg window as Finder shows it (screenshots, light and dark; informational)
        if: needs.changes.outputs.installers == 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: bash test/macos/dmg-screens.sh
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.installers == 'true'
        with:
          name: dmg-window-screenshots
          path: dmg-screens/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.installers == 'true'
        with:
          name: Sidevoice-macOS-AppleSilicon-dmg
          path: dist/
          retention-days: 7
          if-no-files-found: error
      # CI only from here: the same app built with the `probe` feature (src-tauri/src/probe.rs), which adds the
      # probe page and the switch that loads it into the room window. The release app above has neither. On a pull
      # request, the explicit fixture package above and relevant integration checks run.
      - name: Build the CI probe app (feature probe; never shipped)
        run: |
          set -euo pipefail
          npm run build:mac:probe
          # The check on the release app means something: this build does carry the page and its switch.
          BIN="src-tauri/target/packages/probe/Sidevoice.app/Contents/MacOS/sidevoice-desktop"
          grep -q "SIDEVOICE_DEBUG_PAGE" "$BIN"
          grep -q "probe-engine" "$BIN"
          grep -q "probe-card" "$BIN"
          grep -q "SIDEVOICE_DEBUG_ROOM_FLOW" "$BIN"
          grep -q "room-flow" "$BIN"
          grep -q "SIDEVOICE_DEBUG_IDLE_UNLOAD_SECS" "$BIN"
          grep -q "SIDEVOICE_DEBUG_REFUSE_LOAD" "$BIN"
          grep -q "SIDEVOICE_DEBUG_SLOW_TRANSCRIBE" "$BIN"
          grep -q "SIDEVOICE_DEBUG_LOCAL_HOST_FLOW" "$BIN"
          grep -q "local-host-flow" "$BIN"
          grep -q "SIDEVOICE_DEBUG_LOCAL_HOST_PAIR_UPGRADE" "$BIN"
          grep -q "local-host-pair-update" "$BIN"
          grep -q "SIDEVOICE_DEBUG_LOCAL_HOST_PAIR_ROLLBACK" "$BIN"
          grep -q "local-host-pair-rollback" "$BIN"
      - name: The local host from the bundled page (stand-in core on local.sock, pairing, proxy, refusals)
        run: |
          set -euo pipefail
          APP="$PWD/src-tauri/target/packages/probe/Sidevoice.app"
          (cd src-tauri && cargo build --locked --release -p sidevoice-local-host --example local-host-ci)
          TOOL="$PWD/src-tauri/target/release/examples/local-host-ci"
          # A home of its own and short (a Unix socket's path is at most 104 bytes): ~/.sidevoice and the app's config.
          export HOME=/tmp/svhome
          rm -rf "$HOME" && mkdir -p "$HOME"
          "$TOOL" core "$HOME/.sidevoice" > /tmp/lh-core.log 2>&1 &
          CORE=$!
          for i in $(seq 1 50); do [ -S "$HOME/.sidevoice/core/local.sock" ] && break; sleep 0.2; done
          SIDEVOICE_DEBUG=1 SIDEVOICE_DEBUG_LOCAL_HOST_FLOW=1 "$APP/Contents/MacOS/sidevoice-desktop" > /tmp/lh.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do grep -Eq "local-host-flow (ok|error)" /tmp/lh.log && break; sleep 1; done
          PORT=$(sed -nE 's|.*local-host proxy on http://127\.0\.0\.1:([0-9]+).*|\1|p' /tmp/lh.log | head -1)
          # What a page cannot send, from outside the app: each refused by the proxy, none reaching the core.
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$@" "http://127.0.0.1:$PORT/api/presentation/echo"; }
          FAILED=""
          expect() { got=$(code "${@:3}"); echo "$1: $got"; [ "$got" = "$2" ] || FAILED="$FAILED $1=$got"; }
          expect hostile-origin 403 -H "Origin: https://evil.example" -H "Authorization: Bearer x"
          expect no-origin 403 -H "Authorization: Bearer x"
          expect empty-origin 403 -H "Origin;" -H "Authorization: Bearer x"
          expect null-origin 403 -H "Origin: null" -H "Authorization: Bearer x"
          expect wrong-host 421 -H "Host: localhost:$PORT" -H "Origin: tauri://localhost"
          expect rebound-host 421 -H "Host: evil.example:$PORT" -H "Origin: tauri://localhost"
          expect no-secret 401 -H "Origin: tauri://localhost"
          expect guessed-secret 401 -H "Origin: tauri://localhost" -H "Authorization: Bearer AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          kill "$PID" || true
          sleep 1
          kill "$CORE" || true
          echo "--- app"; grep -E "local-host|proxy|page says" /tmp/lh.log || true
          echo "--- stand-in core"; cat /tmp/lh-core.log
          [ -z "$FAILED" ] || { echo "not refused as the table says:$FAILED"; exit 1; }
          # The bundled page: running, the pairing object, preflight → authenticated fetch with the token swapped in
          # and its Origin kept, 401 without the secret, 404 for native's own routes, a WebSocket spliced and refused.
          grep -q "local-host-flow ok" /tmp/lh.log
          LINE=$(grep "local-host-flow ok" /tmp/lh.log)
          for fact in version=3 state=running/api=1 subscribed=running pairing=ok host=fake-machine \
              fetch=200/device/tauri://localhost/the_bundled_page no_secret=401 native_only=404 \
              ws=open/sidevoice/ping_from_the_page ws_no_secret=refused; do
            echo "$LINE" | grep -q " $fact" || { echo "missing $fact"; exit 1; }
          done
          grep -q "proxy answered 204 OPTIONS /api/presentation/echo (preflight)" /tmp/lh.log
          # Only the page's authenticated requests reached the core, each with the device token.
          test "$(grep -c '/api/presentation/echo' /tmp/lh-core.log)" = 1
          grep -q "fake-core POST /api/presentation/echo origin=tauri://localhost auth=device" /tmp/lh-core.log
          grep -q "fake-core GET /api/browser/call origin=tauri://localhost auth=device" /tmp/lh-core.log
          if grep -Eq "auth=other|/api/local/health origin=tauri" /tmp/lh-core.log; then echo "the core saw what it should not"; exit 1; fi
          # The token, stored by the app alone: 0600 in its config directory.
          STORE="$HOME/Library/Application Support/dev.sidevoice.desktop/local-host.json"
          test "$(stat -f %Lp "$STORE")" = 600
      - name: What the interface's window offers (probe page, same origin and permission rule)
        if: needs.changes.outputs.engine == 'true'
        run: bash test/macos/engine-probe.sh
      - name: The call controls card over a full-screen editor (never activating, clicks, drag, typing, states)
        if: needs.changes.outputs.card == 'true'
        run: bash test/macos/card.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-controls-screenshots
          path: card-shots/
          retention-days: 7
          if-no-files-found: warn
      - name: Selecting models through the vendored room itself (consent, cancel, failure, slow, persistence)
        if: needs.changes.outputs.engine == 'true'
        run: bash test/macos/room-flow.sh
  engine:
    name: Native engine on Apple Silicon (download, Kokoro → Whisper round trip)
    needs: [changes, test]
    if: ${{ needs.changes.outputs.engine == 'true' && inputs.r4-native-pair-candidate != true }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Round trip on the accelerator the resolver picks (CPU)
        working-directory: src-tauri
        run: cargo run --locked --release -p sidevoice-desktop-engine --example roundtrip -- "$RUNNER_TEMP/engines"
      - name: Round trip with Core ML (informational)
        continue-on-error: true
        working-directory: src-tauri
        run: cargo run --locked --release -p sidevoice-desktop-engine --example roundtrip -- "$RUNNER_TEMP/engines" coreml
      - name: The engine's libraries (for the record)
        run: |
          find "$RUNNER_TEMP/engines/engines" -name "*.dylib" -exec sh -c 'echo "== $1"; otool -L "$1" | head -8; codesign -dv "$1" 2>&1 | head -3' _ {} \;

  linux:
    name: Linux (.deb, .AppImage)
    needs: [changes, test]
    if: ${{ !inputs.fixture && inputs.r4-native-pair-candidate != true }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles deb,appimage -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-Linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows (installer)
    needs: [changes, test]
    if: ${{ !inputs.fixture && inputs.r4-native-pair-candidate != true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error

  r4-native-pair-smoke-static:
    name: R4 pair smoke static and fixture checks
    if: ${{ inputs.r4-native-pair-candidate == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the locked JavaScript toolchain without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject undefined names in the Mac candidate smoke and its helpers
        run: npm run lint:r4-native-pair-smoke
      - name: Exercise disposable smoke preflight and release safety fixtures
        run: node --test test/native-pair-update-preflight.test.mjs test/committed-pair-release.test.mjs test/release-root-containment.test.mjs test/r4-native-pair-core-pin.test.mjs test/r4-codex-install-registration.test.mjs test/r4-codex-smoke-readiness.test.mjs test/connector-pin.test.mjs
      - name: Verify the pinned Codex CLI package and version without signing in
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/codex-cli" --no-audit --no-fund "@openai/codex@$R4_CODEX_CLI_VERSION"
          mkdir -m 700 "$RUNNER_TEMP/codex-version-home"
          trap 'rm -rf "$RUNNER_TEMP/codex-version-home"' EXIT
          codex_version="$(CODEX_HOME="$RUNNER_TEMP/codex-version-home" "$RUNNER_TEMP/codex-cli/node_modules/.bin/codex" --version)"
          CODEX_VERSION_OUTPUT="$codex_version" node --input-type=module -e 'import { assertCodexCliVersion } from "./test/macos/codex-smoke-readiness.mjs"; assertCodexCliVersion(process.env.CODEX_VERSION_OUTPUT);'

  r4-core-native:
    name: R4 pinned Core source (${{ matrix.target }})
    if: ${{ inputs.r4-native-pair-candidate == true }}
    needs: r4-native-pair-smoke-static
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-aarch64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Desktop's exact source pin
        run: |
          set -euo pipefail
          test "$(jq -r '.core.source_sha' src-tauri/r4-native-pair-source-pin.json)" = "$R4_CORE_SOURCE_SHA"
          test "$(jq -r '.core.cargo_lock_sha256' src-tauri/r4-native-pair-source-pin.json)" = "$R4_CORE_LOCK_SHA256"
      - uses: actions/checkout@v4
        with:
          repository: sidevoice/sidevoice-core
          ref: ${{ env.R4_CORE_SOURCE_SHA }}
          path: core-src
          persist-credentials: false
      - name: Verify the pinned public Core checkout
        run: |
          set -euo pipefail
          test "$(git -C core-src rev-parse HEAD)" = "$R4_CORE_SOURCE_SHA"
          test "$(shasum -a 256 core-src/Cargo.lock | cut -d ' ' -f 1)" = "$R4_CORE_LOCK_SHA256"
      - name: Install the Core producer's native build dependencies
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          if [[ "$TARGET" == macos-* ]]; then
            brew install opus zstd
          else
            sudo apt-get update
            sudo apt-get install -y libopus-dev patchelf zstd pkg-config
          fi
      - name: Build and verify the pinned native Core archive
        working-directory: core-src
        env:
          TARGET: ${{ matrix.target }}
          RUSTVANI_CACHE_DIR: ${{ runner.temp }}/sidevoice-models
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo tree --locked >/dev/null
          python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
          cargo build --locked --release --bin sidevoice-core-rust
          mkdir -p assets/native
          ARCHIVE="assets/native/sidevoice-core-rust-${R4_CORE_SOURCE_SHA}-${TARGET}.tar.zst"
          python3 tools/rust_native_bundle.py build --target "$TARGET" \
            --binary target/release/sidevoice-core-rust --models "$RUSTVANI_CACHE_DIR" \
            --output "$ARCHIVE" --source-sha "$R4_CORE_SOURCE_SHA" \
            --epoch "$(git show -s --format=%ct HEAD)"
          python3 tools/rust_native_bundle.py verify --archive "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: r4-core-native-${{ matrix.target }}
          path: core-src/assets/native/sidevoice-core-rust-${{ env.R4_CORE_SOURCE_SHA }}-${{ matrix.target }}.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  r4-core-manifest:
    name: Assemble exact closed Core input
    if: ${{ inputs.r4-native-pair-candidate == true }}
    needs: r4-core-native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Desktop's exact source pin
        run: |
          set -euo pipefail
          test "$(jq -r '.core.source_sha' src-tauri/r4-native-pair-source-pin.json)" = "$R4_CORE_SOURCE_SHA"
          test "$(jq -r '.core.cargo_lock_sha256' src-tauri/r4-native-pair-source-pin.json)" = "$R4_CORE_LOCK_SHA256"
      - uses: actions/checkout@v4
        with:
          repository: sidevoice/sidevoice-core
          ref: ${{ env.R4_CORE_SOURCE_SHA }}
          path: core-src
          persist-credentials: false
      - name: Verify the pinned source and install zstd for archive validation
        run: |
          set -euo pipefail
          test "$(git -C core-src rev-parse HEAD)" = "$R4_CORE_SOURCE_SHA"
          test "$(shasum -a 256 core-src/Cargo.lock | cut -d ' ' -f 1)" = "$R4_CORE_LOCK_SHA256"
          sudo apt-get update
          sudo apt-get install -y zstd
      - uses: actions/download-artifact@v4
        with:
          pattern: r4-core-native-*
          path: core-src/assets/native
          merge-multiple: true
      - name: Validate all native archives and write the canonical manifest
        working-directory: core-src
        run: python3 tools/rust_native_bundle.py manifest --assets assets/native --source-sha "$R4_CORE_SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: r4-core-source-inputs
          path: core-src/assets/native/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  r4-native-pair-macos:
    name: Build, package and smoke-test one Mac candidate
    if: ${{ inputs.r4-native-pair-candidate == true }}
    needs: [changes, r4-core-manifest]
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the Desktop's exact Connector and Core source pins
        run: |
          set -euo pipefail
          test "$(jq -r '.connector.source_sha' src-tauri/r4-native-pair-source-pin.json)" = "$R4_CONNECTOR_SOURCE_SHA"
          test "$(jq -r '.core.source_sha' src-tauri/r4-native-pair-source-pin.json)" = "$R4_CORE_SOURCE_SHA"
          test "$(jq -r '.core.cargo_lock_sha256' src-tauri/r4-native-pair-source-pin.json)" = "$R4_CORE_LOCK_SHA256"
          test "$(uname -m)" = arm64
      - uses: actions/checkout@v4
        with:
          repository: sidevoice/sidevoice-connector
          ref: ${{ env.R4_CONNECTOR_SOURCE_SHA }}
          path: connector-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sidevoice/sidevoice-core
          ref: ${{ env.R4_CORE_SOURCE_SHA }}
          path: core-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sidevoice/sidevoice-connector
          ref: ${{ env.R4_PREVIOUS_CONNECTOR_SOURCE_SHA }}
          path: connector-previous
          persist-credentials: false
        if: ${{ inputs.r4-native-pair-operator-trial != true }}
      - uses: actions/download-artifact@v4
        with:
          name: r4-core-source-inputs
          path: ${{ runner.temp }}/r4-core-inputs
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            connector-src/package-lock.json
      - name: Install pinned Codex CLI and create its disposable runner profile
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/codex-cli" --no-audit --no-fund "@openai/codex@$R4_CODEX_CLI_VERSION"
          codex_bin="$RUNNER_TEMP/codex-cli/node_modules/.bin/codex"
          mkdir -m 700 "$RUNNER_TEMP/r4-codex-version-home"
          trap 'rm -rf "$RUNNER_TEMP/r4-codex-version-home"' EXIT
          codex_version="$(CODEX_HOME="$RUNNER_TEMP/r4-codex-version-home" "$codex_bin" --version)"
          printf 'Codex CLI: %s\n' "$codex_version"
          CODEX_VERSION_OUTPUT="$codex_version" node --input-type=module -e 'import { assertCodexCliVersion } from "./test/macos/codex-smoke-readiness.mjs"; assertCodexCliVersion(process.env.CODEX_VERSION_OUTPUT);'
          mkdir -m 700 "$RUNNER_TEMP/r4-codex-home"
          printf '%s\n' "$RUNNER_TEMP/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
          printf 'CODEX_HOME=%s\n' "$RUNNER_TEMP/r4-codex-home" >> "$GITHUB_ENV"
          printf 'SIDEVOICE_CODEX_BIN=%s\n' "$codex_bin" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin
      - name: Install the Connector consumer's stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: test "$(node --version)" = v22.23.3
      - name: Align only the exact Connector checkout's Core pin data
        run: |
          set -euo pipefail
          test "$(git -C connector-src rev-parse HEAD)" = "$R4_CONNECTOR_SOURCE_SHA"
          node scripts/align-r4-native-pair-core-pin.mjs connector-src "$R4_CONNECTOR_SOURCE_SHA" \
            src-tauri/r4-native-pair-source-pin.json "$RUNNER_TEMP/r4-native-pair-preview/connector-core-pin-current.json"
      - run: npm ci
      - name: Install Connector dependencies
        working-directory: connector-src
        run: npm ci
      - name: Test the exact Rust Connector source
        working-directory: connector-src
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo test --locked --manifest-path packages/connector-rust/Cargo.toml
      - name: Align the exact prior Connector source to the reviewed Core pin
        if: ${{ inputs.r4-native-pair-operator-trial != true }}
        run: |
          set -euo pipefail
          test "$(git -C connector-previous rev-parse HEAD)" = "$R4_PREVIOUS_CONNECTOR_SOURCE_SHA"
          node scripts/align-r4-native-pair-core-pin.mjs connector-previous "$R4_PREVIOUS_CONNECTOR_SOURCE_SHA" \
            test/fixtures/r4-native-pair-previous-source-pin.json "$RUNNER_TEMP/r4-native-pair-preview/connector-core-pin-previous.json"
      - name: Verify the exact prior Connector source and its aligned native Core pin
        if: ${{ inputs.r4-native-pair-operator-trial != true }}
        run: |
          set -euo pipefail
          check_sha() {
            local label="$1" observed="$2" expected="$3" observed_label=invalid expected_label=invalid
            if [[ "$observed" =~ ^[0-9a-f]{40}$ || "$observed" =~ ^[0-9a-f]{64}$ ]]; then
              observed_label="$observed"
            fi
            if [[ "$expected" =~ ^[0-9a-f]{40}$ || "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              expected_label="$expected"
            fi
            if [[ "$observed" != "$expected" || "$expected_label" == invalid ]]; then
              printf '%s mismatch: observed=%s expected=%s\n' "$label" "$observed_label" "$expected_label" >&2
              return 1
            fi
          }
          check_sha prior-connector-checkout "$(git -C connector-previous rev-parse HEAD)" "$R4_PREVIOUS_CONNECTOR_SOURCE_SHA"
          check_sha prior-connector-source-pin "$(jq -r '.connector.source_sha' test/fixtures/r4-native-pair-previous-source-pin.json)" "$R4_PREVIOUS_CONNECTOR_SOURCE_SHA"
          check_sha prior-core-source-pin "$(jq -r '.source_sha' connector-previous/packages/connector/rust-core-production-pin.json)" "$R4_CORE_SOURCE_SHA"
          check_sha prior-core-cargo-lock-pin "$(jq -r '.cargo_lock_sha256' connector-previous/packages/connector/rust-core-production-pin.json)" "$R4_CORE_LOCK_SHA256"
      - name: Install prior Connector dependencies
        if: ${{ inputs.r4-native-pair-operator-trial != true }}
        working-directory: connector-previous
        run: npm ci
      - name: Build the exact Rust Connector runtime
        working-directory: connector-src
        env:
          RUSTUP_TOOLCHAIN: stable
          SIDEVOICE_CONNECTOR_BUILD_SHA: ${{ env.R4_CONNECTOR_SOURCE_SHA }}
          SIDEVOICE_CONNECTOR_TARGET: macos-aarch64
        run: |
          set -euo pipefail
          export SIDEVOICE_CONNECTOR_VERSION="$(node -p "require('./packages/connector/package.json').version")"
          cargo build --locked --release --manifest-path packages/connector-rust/Cargo.toml
      - name: Verify Codex registration with the pinned CLI in an isolated profile
        working-directory: connector-src
        env:
          SIDEVOICE_RUST_PROOF_BIN: ${{ github.workspace }}/connector-src/packages/connector-rust/target/release/sidevoice-rust-proof
          SIDEVOICE_CODEX_BIN: ${{ runner.temp }}/codex-cli/node_modules/.bin/codex
        run: python3 packages/connector-rust/test/codex_cli_smoke.py
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned Core Python dependencies for the existing Codex queue fixture
        run: |
          set -euo pipefail
          uv venv --python 3.12 core-src/.venv
          uv pip install --python core-src/.venv/bin/python -e ./core-src 'websockets>=15,<16'
      - name: Exercise per-call MCP thread metadata, Codex queue and read receipt against the pinned Core
        env:
          SIDEVOICE_CORE_PYTHON: ${{ github.workspace }}/core-src/.venv/bin/python
          SIDEVOICE_RUST_PROOF_BIN: ${{ github.workspace }}/connector-src/packages/connector-rust/target/release/sidevoice-rust-proof
        run: core-src/.venv/bin/python connector-src/packages/connector-rust/test/interop_core.py
      - name: Build the Connector SEA with the closed source-built Core manifest
        working-directory: connector-src
        env:
          SIDEVOICE_BUILD_SEA: '1'
          SIDEVOICE_REQUIRE_RUST_CORE: '1'
          SIDEVOICE_RUST_CORE_SOURCE_BUILD: '1'
          SIDEVOICE_REQUIRE_RUST_CONNECTOR: '1'
          SIDEVOICE_CHANNEL: release
          SIDEVOICE_BUILD_SEQ: '0'
          SIDEVOICE_CONNECTOR_SHA: ${{ env.R4_CONNECTOR_SOURCE_SHA }}
          SIDEVOICE_RUST_CONNECTOR_SOURCE_SHA: ${{ env.R4_CONNECTOR_SOURCE_SHA }}
          SIDEVOICE_RUST_CONNECTOR_TARGET: macos-aarch64
          SIDEVOICE_RUST_CONNECTOR_BINARY: ${{ github.workspace }}/connector-src/packages/connector-rust/target/release/sidevoice-rust-proof
          SIDEVOICE_RUST_CORE_SOURCE_SHA: ${{ env.R4_CORE_SOURCE_SHA }}
          SIDEVOICE_RUST_CORE_TARGET: macos-aarch64
          SIDEVOICE_RUST_CORE_MANIFEST: ${{ runner.temp }}/r4-core-inputs/native-core-manifest.json
        run: npm run build:sea -w @sidevoice/uplink
      - name: Sign the embedded SEA ad hoc for the app's native resource check
        run: codesign --force --sign - connector-src/packages/connector/dist-sea/macos-aarch64/sidevoice
      - name: Build a genuine prior Rust Connector runtime and SEA for the app update acceptance
        if: ${{ inputs.r4-native-pair-operator-trial != true }}
        working-directory: connector-previous
        env:
          RUSTUP_TOOLCHAIN: stable
          SIDEVOICE_CONNECTOR_BUILD_SHA: ${{ env.R4_PREVIOUS_CONNECTOR_SOURCE_SHA }}
          SIDEVOICE_CONNECTOR_TARGET: macos-aarch64
          SIDEVOICE_BUILD_SEA: '1'
          SIDEVOICE_REQUIRE_RUST_CORE: '1'
          SIDEVOICE_RUST_CORE_SOURCE_BUILD: '1'
          SIDEVOICE_REQUIRE_RUST_CONNECTOR: '1'
          SIDEVOICE_CHANNEL: release
          SIDEVOICE_BUILD_SEQ: '0'
          SIDEVOICE_CONNECTOR_SHA: ${{ env.R4_PREVIOUS_CONNECTOR_SOURCE_SHA }}
          SIDEVOICE_RUST_CONNECTOR_SOURCE_SHA: ${{ env.R4_PREVIOUS_CONNECTOR_SOURCE_SHA }}
          SIDEVOICE_RUST_CONNECTOR_TARGET: macos-aarch64
          SIDEVOICE_RUST_CONNECTOR_BINARY: ${{ github.workspace }}/connector-previous/packages/connector-rust/target/release/sidevoice-rust-proof
          SIDEVOICE_RUST_CORE_SOURCE_SHA: ${{ env.R4_CORE_SOURCE_SHA }}
          SIDEVOICE_RUST_CORE_TARGET: macos-aarch64
          SIDEVOICE_RUST_CORE_MANIFEST: ${{ runner.temp }}/r4-core-inputs/native-core-manifest.json
        run: |
          set -euo pipefail
          export SIDEVOICE_CONNECTOR_VERSION="$(node -p "require('./packages/connector/package.json').version")"
          cargo build --locked --release --manifest-path packages/connector-rust/Cargo.toml
          npm run build:sea -w @sidevoice/uplink
          codesign --force --sign - packages/connector/dist-sea/macos-aarch64/sidevoice
      - name: Pin the prior pair to its exact source-built inputs
        if: ${{ inputs.r4-native-pair-operator-trial != true }}
        run: |
          set -euo pipefail
          node scripts/prepare-r4-native-pair.mjs \
            connector-previous core-src "$RUNNER_TEMP/r4-core-inputs" \
            connector-previous/packages/connector-rust/target/release/sidevoice-rust-proof \
            connector-previous/packages/connector/dist-sea/macos-aarch64/sidevoice \
            "$RUNNER_TEMP/r4-native-pair-previous-pin.json" \
            test/fixtures/r4-native-pair-previous-source-pin.json
      - name: Create the exact native-pair pin from the verified build inputs
        run: |
          set -euo pipefail
          node scripts/prepare-r4-native-pair.mjs \
            connector-src core-src "$RUNNER_TEMP/r4-core-inputs" \
            connector-src/packages/connector-rust/target/release/sidevoice-rust-proof \
            connector-src/packages/connector/dist-sea/macos-aarch64/sidevoice \
            "$RUNNER_TEMP/r4-native-pair-pin.json"
      - name: Run bridge and native pin unit tests
        run: npm test
      - name: Check Rust formatting and local-host unit tests on the hosted Mac runner
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked -p sidevoice-local-host
      - name: Build and verify the Mac app with the source-built bundled pair
        env:
          SIDEVOICE_R4_NATIVE_PAIR_PIN: ${{ runner.temp }}/r4-native-pair-pin.json
          SIDEVOICE_R4_NATIVE_PAIR_SEA: ${{ github.workspace }}/connector-src/packages/connector/dist-sea/macos-aarch64/sidevoice
        run: npm run build:mac:native-pair
      - name: Build the CI-only page-driver app with the same verified pair
        env:
          SIDEVOICE_R4_NATIVE_PAIR_PIN: ${{ runner.temp }}/r4-native-pair-pin.json
          SIDEVOICE_R4_NATIVE_PAIR_SEA: ${{ github.workspace }}/connector-src/packages/connector/dist-sea/macos-aarch64/sidevoice
        run: npm run build:mac:native-pair-probe
      - name: Launch the production app and load its packaged page
        env:
          APP: src-tauri/target/packages/native-pair/Sidevoice.app
          SIDEVOICE_DATA_DIR: ${{ runner.temp }}/r4-production-first-open-data
        run: bash test/macos/first-open.sh
      - name: Install, reach, same-version update, and remove the pair from the packaged page
        env:
          APP: src-tauri/target/packages/native-pair/Sidevoice.app
          DOGFOOD_APP: src-tauri/target/packages/native-pair-probe/Sidevoice.app
          SIDEVOICE_R4_SMOKE_EVIDENCE: ${{ runner.temp }}/r4-native-pair-preview/smoke-evidence.json
        run: node test/macos/native-pair-install-smoke.mjs
      - name: Upgrade and roll back a changed pair through the packaged app bridge
        if: ${{ inputs.r4-native-pair-operator-trial != true }}
        timeout-minutes: 80
        env:
          APP: src-tauri/target/packages/native-pair/Sidevoice.app
          DOGFOOD_APP: src-tauri/target/packages/native-pair-probe/Sidevoice.app
          PREVIOUS_PAIR_PIN: ${{ runner.temp }}/r4-native-pair-previous-pin.json
          PREVIOUS_PAIR_SEA: ${{ github.workspace }}/connector-previous/packages/connector/dist-sea/macos-aarch64/sidevoice
          SIDEVOICE_R4_UPDATE_SMOKE_EVIDENCE: ${{ runner.temp }}/r4-native-pair-preview/update-evidence.json
        run: node test/macos/native-pair-update-smoke.mjs
      - name: Record changed-pair update and rollback as not run for the operator trial
        if: ${{ inputs.r4-native-pair-operator-trial == true }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r4-native-pair-preview"
          cat > "$RUNNER_TEMP/r4-native-pair-preview/update-evidence.json" <<'JSON'
          {
            "schema": 1,
            "kind": "r4-native-pair-update-rollback-smoke",
            "changed_pair_upgrade": "not-run-operator-trial",
            "failed_update_rollback": "not-run-operator-trial"
          }
          JSON
      - name: Include trial limitations with the packaged app
        if: ${{ inputs.r4-native-pair-operator-trial == true }}
        run: cp docs/R4_OPERATOR_TRIAL.md "$RUNNER_TEMP/r4-native-pair-preview/trial-limitations.md"
      - name: Archive the tested app as a short-lived workflow artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r4-native-pair-preview"
          ditto -c -k --keepParent src-tauri/target/packages/native-pair/Sidevoice.app \
            "$RUNNER_TEMP/r4-native-pair-preview/Sidevoice-macOS-arm64-R4-native-pair.zip"
          cp dist/build-evidence.json "$RUNNER_TEMP/r4-native-pair-preview/build-evidence.json"
          (cd "$RUNNER_TEMP/r4-native-pair-preview" && shasum -a 256 -- * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-macOS-arm64-R4-native-pair-${{ inputs.r4-native-pair-operator-trial == true && 'operator-trial' || 'candidate' }}-${{ github.sha }}
          path: ${{ runner.temp }}/r4-native-pair-preview/
          retention-days: 7
          if-no-files-found: error

  # Only after every job above passed: the installers of this run go to the release that called it, or replace the
  # rolling `nightly` pre-release (RELEASING.md). Pull requests never get here.
  publish:
    name: Publish (release or nightly)
    needs: [changes, test, macos, engine, linux, windows]
    if: needs.changes.outputs.publish != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KIND: ${{ needs.changes.outputs.publish }}
      TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: Sidevoice-*
          path: artifacts
      - name: The assets and their SHA256SUMS
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir assets
          find artifacts -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} assets/ \;
          if [ "$KIND" = nightly ]; then
            # Stable names, so a link to the nightly .dmg keeps working; the app inside still says $VERSION.
            for f in assets/*; do mv "$f" "${f/_${VERSION}_/_nightly_}"; done
          fi
          for ext in dmg exe deb AppImage; do ls assets/*."$ext" >/dev/null; done
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -la assets; cat assets/SHA256SUMS
      - name: Attach to the release, then publish it (a version with -rc.N is a pre-release, never latest)
        if: env.KIND == 'release'
        run: |
          set -euo pipefail
          gh release upload "$TAG" assets/* --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
      - name: Replace the nightly pre-release (move its tag here, replace every asset)
        if: env.KIND == 'nightly'
        env:
          WHEN: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          fi
          NOTES="Snapshot of \`main\` at $GITHUB_SHA (committed $WHEN). Not a versioned release: the \`nightly\` tag moves to every commit on \`main\` whose CI passes, and these assets are replaced each time. Versioned releases are the \`vX.Y.Z\` ones."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "Nightly (main)" --notes "$NOTES" --prerelease --latest=false
            gh release upload nightly assets/* --clobber
            # Anything left from an older snapshot that this one did not replace.
            gh release view nightly --json assets -q '.assets[].name' | while read -r name; do
              [ -e "assets/$name" ] || gh release delete-asset nightly "$name" --yes
            done
          else
            gh release create nightly assets/* --verify-tag --title "Nightly (main)" --notes "$NOTES" \
              --prerelease --latest=false
          fi
