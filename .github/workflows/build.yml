name: build

# What runs when (RELEASING.md):
# - pull request: lint + unit tests on Linux; the Apple-Silicon native-engine jobs only when the engine, the bridge,
#   the catalogue or the CI probes change (`changes` below).
# - push to main, manual run: everything, installers included; a green run on main replaces the `nightly` pre-release.
# - a release (called by release-please.yml with the tag it created): everything, attached to that release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: The draft release release-please created (vX.Y.Z); its assets are built from that tag.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Per ref. A release (github.workflow is the caller's, release-please) never shares a group with a push.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - name: Webview toolkit (the shell links against it even to lint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bridge script tests
        run: npm test
      - name: The icons, tray and .dmg window are what the brand files draw (npm run icons)
        run: |
          npm run icons
          git status --porcelain -- src-tauri/icons src-tauri/dmg ui/brand
          git diff --quiet --exit-code -- src-tauri/icons src-tauri/dmg ui/brand
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --workspace

  changes:
    name: What this run builds
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      # The Apple-Silicon engine round trip, the probe page and the room flow.
      native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native == 'true' }}
      # .dmg, Windows installer, .deb/.AppImage: never on a pull request.
      installers: ${{ github.event_name != 'pull_request' }}
      # Where the installers go: the release that called this, or the rolling `nightly` pre-release on a push to main.
      publish: ${{ inputs.release-tag && 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nightly' || '' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            native:
              - 'src-tauri/engine/**'
              - 'src-tauri/src/engine_ipc.rs'
              - 'src-tauri/src/probe.rs'
              - 'src-tauri/core/src/engines.rs'
              - 'src-tauri/core/src/bridge.rs'
              - 'bridge/**'
              - 'catalog/**'
              - 'test/fixtures/**'
              - 'ui/voice/**'

  macos:
    name: macOS (Apple Silicon) .dmg and native flow
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app bundle (ad-hoc signed, hardened runtime, entitlements)
        if: needs.changes.outputs.installers == 'true'
        run: npx tauri build --target aarch64-apple-darwin --bundles app
      - name: Check what a first open depends on
        if: needs.changes.outputs.installers == 'true'
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          test -d "$APP"
          echo "--- Info.plist"
          plutil -p "$APP/Contents/Info.plist"
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Contents/Info.plist"
          test "$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")" = "13.0"
          echo "--- signature"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | tee /tmp/sig.txt
          grep -q "Signature=adhoc" /tmp/sig.txt
          grep -q "runtime" /tmp/sig.txt
          echo "--- entitlements"
          codesign -d --entitlements - --xml "$APP" > /tmp/ent.xml
          cat /tmp/ent.xml; echo
          grep -q "com.apple.security.device.audio-input" /tmp/ent.xml
          grep -q "com.apple.security.cs.disable-library-validation" /tmp/ent.xml
          echo "--- icon"
          test "$(plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist")" = "icon.icns"
          iconutil --convert iconset --output /tmp/icon.iconset "$APP/Contents/Resources/icon.icns"
          ls /tmp/icon.iconset
          for f in 16x16 16x16@2x 32x32 32x32@2x 128x128 128x128@2x 256x256 256x256@2x 512x512 512x512@2x; do
            test -s "/tmp/icon.iconset/icon_$f.png"
          done
          sips -g pixelWidth /tmp/icon.iconset/icon_512x512@2x.png | grep -q 1024
          # How macOS itself decodes every entry, for the record (uploaded with the .dmg window screenshots).
          mkdir -p dmg-screens && cp -R /tmp/icon.iconset dmg-screens/
          test "$(plutil -extract CFBundleName raw "$APP/Contents/Info.plist")" = "Sidevoice"
          echo "--- architecture"
          lipo -archs "$APP/Contents/MacOS/sidevoice-desktop" | tee /dev/stderr | grep -q arm64
          echo "--- no CI probe in a release (src-tauri/src/probe.rs is behind the probe feature)"
          if grep -q "SIDEVOICE_DEBUG_PAGE" "$APP/Contents/MacOS/sidevoice-desktop"; then echo "the probe switch is in the release app"; exit 1; fi
          if grep -q "probe-engine" "$APP/Contents/MacOS/sidevoice-desktop"; then echo "the probe page is in the release app"; exit 1; fi
          if grep -q "SIDEVOICE_DEBUG_ROOM_FLOW" "$APP/Contents/MacOS/sidevoice-desktop"; then echo "the room-flow switch is in the release app"; exit 1; fi
          if grep -q "room-flow" "$APP/Contents/MacOS/sidevoice-desktop"; then echo "the room-flow script is in the release app"; exit 1; fi
          if grep -q "SIDEVOICE_DEBUG_IDLE_UNLOAD_SECS" "$APP/Contents/MacOS/sidevoice-desktop"; then echo "the idle-time switch is in the release app"; exit 1; fi
          if grep -Eq "SIDEVOICE_DEBUG_(REFUSE_LOAD|SLOW_TRANSCRIBE)" "$APP/Contents/MacOS/sidevoice-desktop"; then echo "a fault switch is in the release app"; exit 1; fi
      - name: First open (no settings) — the bundled interface comes up in the real WKWebView
        if: needs.changes.outputs.installers == 'true'
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          # Asking for the probe page changes nothing in a release: the interface loads (checked below).
          SIDEVOICE_DEBUG=1 SIDEVOICE_DEBUG_PAGE=probe.html SIDEVOICE_DEBUG_ROOM_FLOW=1 "$APP/Contents/MacOS/sidevoice-desktop" > /tmp/app.log 2>&1 &
          PID=$!
          for i in $(seq 1 45); do grep -q "ready: true" /tmp/app.log && break; sleep 1; done
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then echo "The app exited on its own:"; cat /tmp/app.log; exit 1; fi
          kill "$PID"; cat /tmp/app.log
          # The interface loaded from the app itself, and its controller came up: the bridge attached to the
          # real web UI's store and actions, and reached the app over IPC.
          grep -q "page tauri://localhost/voice/index.html" /tmp/app.log
          if grep -Eq "probe.html|room-flow" /tmp/app.log; then echo "a release ran a CI probe"; exit 1; fi
          grep -q "ready: true" /tmp/app.log
      - name: With a target (a fake node on loopback)
        if: needs.changes.outputs.installers == 'true'
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          CONF="$HOME/Library/Application Support/dev.sidevoice.desktop"
          mkdir -p "$CONF"
          printf '{"target":"http://127.0.0.1:8768","muteShortcut":""}' > "$CONF/settings.json"
          python3 -u test/fixtures/fake-node.py 8768 > /tmp/node.log 2>&1 &
          NODE=$!
          SIDEVOICE_DEBUG=1 "$APP/Contents/MacOS/sidevoice-desktop" > /tmp/target.log 2>&1 &
          PID=$!
          for i in $(seq 1 45); do grep -q "ready: true" /tmp/target.log && break; sleep 1; done
          sleep 5
          kill "$PID" || true
          kill "$NODE" || true  # the probe below starts its own on the same port
          rm -rf "$CONF"
          echo "--- app"; cat /tmp/target.log
          echo "--- fake node (what the interface asked, cross-origin)"; sort /tmp/node.log | uniq -c
          grep -q "ready: true" /tmp/target.log
          # The interface asked its target from the app's own origin (cross-origin), with no pairing yet.
          grep -q "origin=tauri://localhost" /tmp/node.log
      - name: Make the .dmg (the brand's window, with background, icon layout and volume icon)
        if: needs.changes.outputs.installers == 'true'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          # One TIFF with the 1x and 2x drawings: Finder picks the one for the screen.
          tiffutil -cathidpicheck src-tauri/dmg/background.png src-tauri/dmg/background@2x.png -out "$RUNNER_TEMP/background.tiff"
          mkdir -p dist
          DMG="dist/Sidevoice_${VERSION}_aarch64.dmg"
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s scripts/dmg-settings.py \
            -D app="$APP" -D background="$RUNNER_TEMP/background.tiff" \
            -D layout=src-tauri/dmg/layout.json -D icon=src-tauri/icons/icon.icns \
            Sidevoice "$DMG"
          hdiutil verify "$DMG"
          # Check the app as shipped, inside the image, not the one in the build tree.
          MNT=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG"
          ls -la "$MNT"
          test -s "$MNT/.background.tiff"
          test -L "$MNT/Applications"
          test -s "$MNT/.DS_Store"
          test -s "$MNT/.VolumeIcon.icns"
          codesign --verify --deep --strict --verbose=2 "$MNT/Sidevoice.app"
          codesign -d --entitlements - --xml "$MNT/Sidevoice.app" | grep -q "com.apple.security.device.audio-input"
          plutil -extract NSMicrophoneUsageDescription raw "$MNT/Sidevoice.app/Contents/Info.plist"
          hdiutil detach "$MNT"
          cp docs/FIRST_OPEN.txt dist/LEEME-primera-apertura.txt
          (cd dist && shasum -a 256 *.dmg | tee SHA256SUMS.txt)
      - name: The .dmg window as Finder shows it (screenshots, light and dark; informational)
        if: needs.changes.outputs.installers == 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -uo pipefail
          osa() { perl -e 'alarm shift; exec @ARGV' 30 osascript "$@"; }  # a permission prompt must not hang the job
          mkdir -p dmg-screens
          DMG=$(ls dist/*.dmg)
          hdiutil attach -readonly "$DMG" | tee /tmp/attach.txt
          VOL=$(grep -o '/Volumes/.*' /tmp/attach.txt | head -1)
          for mode in false true; do
            osa -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $mode" || true
            osa -e "tell application \"Finder\" to close every window" \
                      -e "tell application \"Finder\" to open (POSIX file \"$VOL\" as alias)" \
                      -e "tell application \"Finder\" to activate" || true
            sleep 4
            B=$(osa -e 'tell application "Finder" to get bounds of front window' | tr -d ' ')
            echo "window bounds ($mode): $B"
            IFS=, read -r X1 Y1 X2 Y2 <<< "${B:-0,28,1440,900}"
            screencapture -x -R"$X1,$((Y1 - 28)),$((X2 - X1)),$((Y2 - Y1 + 28))" "dmg-screens/dmg-dark-$mode.png" || screencapture -x "dmg-screens/dmg-dark-$mode-full.png"
          done
          osa -e 'tell application "Finder" to close every window' || true
          hdiutil detach "$VOL" || true
          ls -la dmg-screens
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.installers == 'true'
        with:
          name: dmg-window-screenshots
          path: dmg-screens/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.installers == 'true'
        with:
          name: Sidevoice-macOS-AppleSilicon-dmg
          path: dist/
          retention-days: 7
          if-no-files-found: error
      # CI only from here: the same app built with the `probe` feature (src-tauri/src/probe.rs), which adds the
      # probe page and the switch that loads it into the room window. The release app above has neither. On a pull
      # request (engine, bridge, catalogue or probe changes) only this part runs.
      - name: Build the CI probe app (feature probe; never shipped)
        run: |
          set -euo pipefail
          npx tauri build --target aarch64-apple-darwin --bundles app --features probe
          # The check on the release app means something: this build does carry the page and its switch.
          BIN="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app/Contents/MacOS/sidevoice-desktop"
          grep -q "SIDEVOICE_DEBUG_PAGE" "$BIN"
          grep -q "probe-engine" "$BIN"
          grep -q "SIDEVOICE_DEBUG_ROOM_FLOW" "$BIN"
          grep -q "room-flow" "$BIN"
          grep -q "SIDEVOICE_DEBUG_IDLE_UNLOAD_SECS" "$BIN"
          grep -q "SIDEVOICE_DEBUG_REFUSE_LOAD" "$BIN"
          grep -q "SIDEVOICE_DEBUG_SLOW_TRANSCRIBE" "$BIN"
      - name: What the interface's window offers (probe page, same origin and permission rule)
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          python3 -u test/fixtures/fake-node.py 8768 > /tmp/probe-node.log 2>&1 &
          NODE=$!
          # A model stays in memory 5 s unused here (10 minutes in a release), so the probe sees D13 happen.
          SIDEVOICE_DEBUG=1 SIDEVOICE_DEBUG_PAGE=probe.html SIDEVOICE_DEBUG_IDLE_UNLOAD_SECS=5 \
            "$APP/Contents/MacOS/sidevoice-desktop" > /tmp/probe.log 2>&1 &
          PID=$!
          for i in $(seq 1 240); do grep -q "probe-engine" /tmp/probe.log && break; sleep 1; done
          kill "$PID" || true
          cat /tmp/probe.log
          echo "--- macOS $(sw_vers -productVersion)"
          grep -q "page tauri://localhost/probe.html" /tmp/probe.log
          # Pairing needs a secure context and WebCrypto ECDSA P-256 on the app's own origin.
          grep -q "probe origin=tauri://localhost secure=true ecdsa=true" /tmp/probe.log
          # A local node (http://127.0.0.1:8768) reached from the app's origin with a device token: preflight + CORS.
          kill "$NODE" || true
          grep -q 'probe-loopback 200 Bearer probe-token' /tmp/probe.log
          grep -q 'request OPTIONS /api/presentation/echo origin=tauri://localhost' /tmp/probe-node.log
          grep "sidevoice: media" /tmp/probe.log || echo "(WebKit did not ask the app about the microphone)"
          # The native engine inside the signed app, through the bridge the interface uses (docs/BRIDGE.md):
          # capabilities with the OS's real memory, downloads with progress, the builds on disk by model + engine,
          # Kokoro says a sentence and Whisper hears it, and a page engine is refused rather than replaced.
          grep -q 'probe-engine ok' /tmp/probe.log
          grep -q 'probe-engine ok capabilities={"runs":"native","os":"macos","arch":"aarch64","has":\["cpu","coreml"' /tmp/probe.log
          grep -Eq 'probe-engine ok .*"memory_mb":[1-9][0-9]{3,}' /tmp/probe.log
          grep -q 'probe-engine ok .* installed=kokoro-82m-v1.0@sherpa-onnx,whisper-tiny@sherpa-onnx ' /tmp/probe.log
          grep -Eq 'probe-engine ok .* progress_calls=[1-9]' /tmp/probe.log
          grep -q 'probe-engine ok .* refused=yes ' /tmp/probe.log
          grep -iq 'probe-engine ok.*prueba' /tmp/probe.log
          # Load → transcribe → unload (sidevoice/sidevoice-core#21 phase 3): loaded once, one model in memory each for every
          # language (Spanish, then English), freed on unload; the OS's memory and what is available of it.
          grep -q 'probe-engine ok .* before_load=kokoro-82m-v1.0@sherpa-onnx/cpu load_ms=' /tmp/probe.log
          grep -q 'probe-engine ok .* load_ms=\([0-9]*\) load_again_ms=\1 ' /tmp/probe.log
          grep -q 'probe-engine ok .* loaded=kokoro-82m-v1.0@sherpa-onnx/cpu,whisper-tiny@sherpa-onnx/cpu since_ok=true same_models=true unloaded=kokoro-82m-v1.0@sherpa-onnx/cpu ' /tmp/probe.log
          grep -Eq 'probe-engine ok .* memory=\{"total_mb":[1-9][0-9]{3,},"available_mb":[1-9][0-9]*\}' /tmp/probe.log
          grep -Eiq 'probe-engine ok .* text_en="[^"]*(test|voice)' /tmp/probe.log
          # D13: after the call, unused for the idle time, both unloaded by the app; loaded again as the next call connects.
          grep -q 'sidevoice: engine unloaded idle whisper-tiny@sherpa-onnx/cpu' /tmp/probe.log
          grep -q 'sidevoice: engine unloaded idle kokoro-82m-v1.0@sherpa-onnx/cpu' /tmp/probe.log
          grep -q 'sidevoice: engine preload whisper-tiny@sherpa-onnx/cpu load_ms=' /tmp/probe.log
          grep -q 'probe-engine ok .* preloaded=kokoro-82m-v1.0@sherpa-onnx/cpu,whisper-tiny@sherpa-onnx/cpu ' /tmp/probe.log
          # Cancel: a download stopped mid-way rejects with install_cancelled; progress events carry the job, the build
          # and the speed; nothing of it is left on disk.
          grep -q 'probe-engine ok .* cancel=true/install_cancelled/false cancel_gone=true progress_event=bytes_per_s+done+engine+job+model+total:true ' /tmp/probe.log
          grep -Eq 'probe-engine ok .* speed=[1-9][0-9]* ' /tmp/probe.log
          MODELS="$HOME/Library/Application Support/dev.sidevoice.desktop/engines/models/sherpa-onnx"
          ls -la "$MODELS"
          if ls "$MODELS" | grep -q whisper-small; then echo "a cancelled download left files"; exit 1; fi
          # Headset buttons: a (simulated) call made the app the Now Playing app, and it let go after.
          grep -q 'probe-headset ok' /tmp/probe.log
          grep -q 'headset apply active=true in_call=true mic=true' /tmp/probe.log
          grep 'headset apply' /tmp/probe.log | tail -1 | grep -q 'active=false in_call=false .* gesture_on=false' 
          grep 'headset apply' /tmp/probe.log
          # The app's own mute is not mistaken for an AirPods gesture.
          if grep -q 'headset airpods' /tmp/probe.log; then echo 'echo recorded as a gesture'; exit 1; fi
      - name: Selecting models through the vendored room itself (consent, cancel, failure, slow, persistence)
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          # From nothing on disk, so the room downloads what it selects (the probe above downloaded into the same place).
          rm -rf "$HOME/Library/Application Support/dev.sidevoice.desktop/engines"
          # The machine the room is paired with (its identity proven; it stores the choices per machine).
          python3 -u test/fixtures/fake-node.py 8768 > /tmp/room-node.log 2>&1 &
          NODE=$!
          # Real models; only a refused load (whisper-tiny) and a slow transcription (whisper-base on Core ML) injected.
          SIDEVOICE_DEBUG=1 SIDEVOICE_DEBUG_ROOM_FLOW=1 SIDEVOICE_DEBUG_REFUSE_LOAD=whisper-tiny \
            SIDEVOICE_DEBUG_SLOW_TRANSCRIBE=whisper-base/coreml:2500 \
            "$APP/Contents/MacOS/sidevoice-desktop" > /tmp/room.log 2>&1 &
          PID=$!
          for i in $(seq 1 600); do grep -Eq "room-flow (ok|error)" /tmp/room.log && break; sleep 1; done
          kill "$PID" "$NODE" || true
          cat /tmp/room.log
          cat ui/voice/web-source.json
          MODELS="$HOME/Library/Application Support/dev.sidevoice.desktop/engines/models/sherpa-onnx"
          ls -la "$MODELS"
          # The actual vendored room (ui/voice), not a test page: its settings actions, controller, selection, native
          # worker and storage, over this app's bridge and engine (test/fixtures/room-flow.js).
          grep -q "page tauri://localhost/voice/index.html" /tmp/room.log
          grep -q 'room-flow ok' /tmp/room.log
          LINE=$(grep 'room-flow ok' /tmp/room.log)
          # What the room asked the app, and the offers it resolved from it: the five native models, nothing of the page's.
          echo "$LINE" | grep -q 'capabilities={"runs":"native","os":"macos","arch":"aarch64","has":\["cpu","coreml"'
          echo "$LINE" | grep -Eq '"memory_mb":[1-9][0-9]{3,}'
          echo "$LINE" | grep -Eq ' engines=(sherpa-onnx/[a-z]+,?)+ '
          for model in whisper-tiny whisper-base whisper-small whisper-large-v3-turbo; do echo "$LINE" | grep -Eq " offers_stt=[^ ]*$model"; done
          echo "$LINE" | grep -q ' offers_tts=kokoro-82m-v1.0 '
          if echo "$LINE" | grep -Eq 'transformers-js|webgpu|wasm'; then echo "a page engine in the app"; exit 1; fi
          echo "$LINE" | grep -Eq ' shown_stt=[^ ]*whisper-tiny'
          echo "$LINE" | grep -Eq ' shown_tts=[^ ]*kokoro-82m-v1.0'
          echo "$LINE" | grep -q ' where=app '
          # 1. Consent with the size, then download → load → two passes → in effect, stored, loaded.
          echo "$LINE" | grep -Eq ' consent_size=[1-9][0-9]{7,} stored_before=none chosen=whisper-base/auto chosen_resident=whisper-base@sherpa-onnx/cpu chosen_passes=2 '
          # 2. Cancelled mid-download: nothing stored, nothing loaded, nothing installed, the download row cancelled.
          echo "$LINE" | grep -Eq ' cancel_at=[1-9][0-9]*/[1-9][0-9]* cancel_download=cancelled cancel_stored=whisper-base/auto cancel_resident=whisper-base@sherpa-onnx/cpu cancel_installed=false '
          if ls "$MODELS" | grep -q whisper-small; then echo "a cancelled download left files"; exit 1; fi
          # 3. A failed load: its step and cause, the model in use still in use and alone in memory.
          echo "$LINE" | grep -Eq ' fail_step=load fail_key=(runtime_failed|load_failed) fail_stored=whisper-base/auto fail_resident=whisper-base@sherpa-onnx/cpu '
          # 4. Slow on Core ML: declined, nothing changes and its copy goes; accepted, it is stored and the old copy goes.
          echo "$LINE" | grep -Eq ' slow_latency_ms=(2[0-9]{3}|[3-9][0-9]{3}) declined_stored=whisper-base/auto declined_resident=whisper-base@sherpa-onnx/cpu '
          echo "$LINE" | grep -q ' accepted_stored=whisper-base/coreml accepted_resident=whisper-base@sherpa-onnx/coreml '
          # 5. After a reload, with the machine reached: settings show the stored choice; the next selection starts from it.
          echo "$LINE" | grep -q ' reload_reach=ok reload_restored=whisper-base/coreml reload_restored_pane=whisper-base/sherpa-onnx/coreml '
          echo "$LINE" | grep -q ' reload_after_stored=whisper-base/auto reload_after_resident=whisper-base@sherpa-onnx/cpu'
          grep -q 'request GET /api/device/identity' /tmp/room-node.log

  engine:
    name: Native engine on Apple Silicon (download, Kokoro → Whisper round trip)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Round trip on the accelerator the resolver picks (CPU)
        working-directory: src-tauri
        run: cargo run --release -p sidevoice-desktop-engine --example roundtrip -- "$RUNNER_TEMP/engines"
      - name: Round trip with Core ML (informational)
        continue-on-error: true
        working-directory: src-tauri
        run: cargo run --release -p sidevoice-desktop-engine --example roundtrip -- "$RUNNER_TEMP/engines" coreml
      - name: The engine's libraries (for the record)
        run: |
          find "$RUNNER_TEMP/engines/engines" -name "*.dylib" -exec sh -c 'echo "== $1"; otool -L "$1" | head -8; codesign -dv "$1" 2>&1 | head -3' _ {} \;

  linux:
    name: Linux (.deb, .AppImage)
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-Linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows (installer)
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error

  # Only after every job above passed: the installers of this run go to the release that called it, or replace the
  # rolling `nightly` pre-release (RELEASING.md). Pull requests never get here.
  publish:
    name: Publish (release or nightly)
    needs: [changes, test, macos, engine, linux, windows]
    if: needs.changes.outputs.publish != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KIND: ${{ needs.changes.outputs.publish }}
      TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: Sidevoice-*
          path: artifacts
      - name: The assets and their SHA256SUMS
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir assets
          find artifacts -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} assets/ \;
          if [ "$KIND" = nightly ]; then
            # Stable names, so a link to the nightly .dmg keeps working; the app inside still says $VERSION.
            for f in assets/*; do mv "$f" "${f/_${VERSION}_/_nightly_}"; done
          fi
          for ext in dmg exe deb AppImage; do ls assets/*."$ext" >/dev/null; done
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -la assets; cat assets/SHA256SUMS
      - name: Attach to the release, then publish it (a version with -rc.N is a pre-release, never latest)
        if: env.KIND == 'release'
        run: |
          set -euo pipefail
          gh release upload "$TAG" assets/* --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
      - name: Replace the nightly pre-release (move its tag here, replace every asset)
        if: env.KIND == 'nightly'
        env:
          WHEN: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          fi
          NOTES="Snapshot of \`main\` at $GITHUB_SHA (committed $WHEN). Not a versioned release: the \`nightly\` tag moves to every commit on \`main\` whose CI passes, and these assets are replaced each time. Versioned releases are the \`vX.Y.Z\` ones."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "Nightly (main)" --notes "$NOTES" --prerelease --latest=false
            gh release upload nightly assets/* --clobber
            # Anything left from an older snapshot that this one did not replace.
            gh release view nightly --json assets -q '.assets[].name' | while read -r name; do
              [ -e "assets/$name" ] || gh release delete-asset nightly "$name" --yes
            done
          else
            gh release create nightly assets/* --verify-tag --title "Nightly (main)" --notes "$NOTES" \
              --prerelease --latest=false
          fi
