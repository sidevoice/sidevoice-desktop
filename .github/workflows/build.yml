name: build

# What runs when (RELEASING.md):
# - pull request: lint + unit tests on Linux, unit tests on Windows, the Windows and Linux app builds (the repo is
#   public: Actions minutes are free), and the Apple-Silicon native flows: the probe app's (`macos-native`) and a call on the engine's real
#   models (`macos-call`). No .dmg.
# - push to main, manual run: everything, installers included. On main, once the installers' jobs (`macos`, `linux`,
#   `windows`) and the lint pass, the `nightly` pre-release is replaced; the native flows run beside them and the
#   nightly does not wait for them (a failing one still fails the run).
# - a release (called by release-please.yml with the tag it created): everything, attached to that release only when
#   every job passed, the native flows included.
# The macOS jobs run side by side: the release app and .dmg (`macos`, the only one with signing secrets), the probe
# app's flows and the real-model call; none waits for another.
# The macOS app and .dmg are signed with the Developer ID and notarized for a release, the nightly (a push to main), or a
# manual run asked to (`sign`: a dry signed build, its .dmg an artifact, nothing published); otherwise they are ad-hoc
# signed (RELEASING.md).
# Every step is a `cargo xtask` command (xtask/src/main.rs), which runs the same on a laptop: this file sets up the
# machine, wires the secrets into the environment and chooses which steps run.
# The Rust build caches, sherpa-onnx's libraries and the real call's models are written only by a push to main (a
# release too: release-please runs on one); a pull request or a manual run only restores them (RELEASING.md → "CI
# caches").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the macOS app and .dmg with the Developer ID and notarize them (a dry signed build; nothing is published)
        type: boolean
        default: false
  workflow_call:
    inputs:
      release-tag:
        description: The draft release release-please created (vX.Y.Z); its assets are built from that tag.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Per ref. A release (github.workflow is the caller's, release-please) never shares a group with a push.
  # A pull request's newer push cancels its older run; on main a running build finishes (its nightly is signed and
  # notarized, which a merge right after would otherwise cancel every time) and only the newest push waits behind it.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The bundled web interface is a release of sidevoice-web (web.pin.json): its attestation is verified wherever it is
  # fetched (`npm run web`, and every Tauri build through it), with gh and this run's token.
  SIDEVOICE_WEB_ATTESTATION: require
  GH_TOKEN: ${{ github.token }}

jobs:
  platform-boundary:
    name: Platform boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - name: Webview toolkit (the shell links against it even to lint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo xtask web
      - name: OS-specific source outside platform
        run: cargo xtask platform-guard
      - name: Disallowed OS APIs (app and xtask)
        if: ${{ !cancelled() }}
        run: cargo xtask platform-clippy

  test:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - name: Webview toolkit (the shell links against it even to lint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: target/web
          key: web-${{ hashFiles('web.pin.json', 'scripts/build-web.mjs', 'scripts/web-release.mjs') }}
      - name: The build tooling's own tests (xtask)
        run: cargo test --locked --manifest-path xtask/Cargo.toml
      - name: The web interface at the pin (web.pin.json)
        run: cargo xtask web
      - name: The icons, tray and .dmg window are what the brand files draw (npm run icons)
        run: cargo xtask icons
      - name: rustfmt and clippy (the app and xtask)
        run: cargo xtask lint
      - name: Bridge script and Rust unit tests
        run: cargo xtask test
      - name: The local host with two users (a second uid cannot open the core socket, link as a connector, or use the proxy)
        run: cargo xtask two-users

  changes:
    name: What this run builds
    runs-on: ubuntu-24.04
    outputs:
      # The macOS app and .dmg (the `macos` job): never on a pull request. (Windows and Linux build their installers on
      # every run; the macOS native flows run on every run too.)
      installers: ${{ github.event_name != 'pull_request' }}
      # The macOS app and .dmg signed with the Developer ID and notarized: a release, the nightly (a push to main, so
      # Gatekeeper opens it on managed Macs too), or a manual run that asks for it. Never on a pull request.
      sign: ${{ inputs.release-tag && 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'true' || (github.event_name == 'workflow_dispatch' && inputs.sign && 'true') || 'false' }}
      # Where the installers go: the release that called this, or the rolling `nightly` pre-release on a push to main.
      publish: ${{ inputs.release-tag && 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nightly' || '' }}
      # What the app is built as (RELEASING.md → "Channels"): a release or the nightly, each with the updater on its own
      # feed and its update artifacts signed with the updater's key, or a dev build (pull requests, manual runs, `sign`
      # too).
      channel: ${{ inputs.release-tag && 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nightly' || 'dev' }}
    steps:
      # The decisions are the outputs above; a job runs at least one step.
      - env:
          TAG: ${{ inputs.release-tag }}
        run: echo "$GITHUB_EVENT_NAME on $GITHUB_REF${TAG:+, release $TAG}"

  # The app and .dmg as they ship: built, signed, notarized, checked and handed to Publish. The only job that sees the
  # Apple signing secrets.
  macos:
    name: macOS (Apple Silicon) app and .dmg
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      # The Rust build cache it shares with `macos-native`, which builds the same dependencies and more (the local
      # host's CI tool) and so is the one that writes it.
      - uses: ./.github/actions/setup-rust
        with:
          cache: macos
          save-cache: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: target/web
          key: web-${{ hashFiles('web.pin.json', 'scripts/build-web.mjs', 'scripts/web-release.mjs') }}
      - name: Build the app bundle (ad-hoc signed, hardened runtime, entitlements)
        if: needs.changes.outputs.sign != 'true'
        # The nightly's update artifact is signed with the updater's key; no PR or manual run reads it.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.changes.outputs.channel == 'nightly' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.changes.outputs.channel == 'nightly' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: cargo xtask release app --channel ${{ needs.changes.outputs.channel }}
      # Tauri's bundler imports the certificate into a keychain of its own, signs every binary with the hardened runtime
      # and the entitlements (src-tauri/packaging/macos/Entitlements.plist), then notarizes the app with the API key (the .p8 as a file
      # only the runner's user may read, removed when the step ends) and staples it.
      - name: Build the app bundle (Developer ID signed, hardened runtime, notarized and stapled)
        if: needs.changes.outputs.sign == 'true'
        env:
          APPLE_CERTIFICATE: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_P8: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_API_KEY_P8 || '' }}
          # A release's or the nightly's update artifact (the app as a .tar.gz) is signed with the updater's key; a dev
          # build (a manual `sign` run) makes none.
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.changes.outputs.channel != 'dev' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.changes.outputs.channel != 'dev' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: cargo xtask release app --signed --channel ${{ needs.changes.outputs.channel }}
      - name: Check what a first open depends on
        env:
          APPLE_TEAM_ID: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: cargo xtask release check-app ${{ needs.changes.outputs.sign == 'true' && '--signed' || '' }}
      - name: First open (no settings) — the bundled interface comes up in the real WKWebView
        run: cargo xtask release first-open
      - name: Make the .dmg (the brand's window, with background, icon layout and volume icon)
        run: cargo xtask release package ${{ needs.changes.outputs.sign == 'true' && '--signed' || '' }}
      # The image itself: signed with the Developer ID (from a keychain of the step's own, the bundler's being gone),
      # notarized and stapled, so Gatekeeper opens it from a download without a word.
      - name: Sign, notarize and staple the .dmg
        if: needs.changes.outputs.sign == 'true'
        env:
          APPLE_CERTIFICATE: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_P8: ${{ needs.changes.outputs.sign == 'true' && secrets.APPLE_API_KEY_P8 || '' }}
        run: cargo xtask release sign-package
      - name: The .dmg's checksum
        run: cargo xtask release checksums
      - name: Record produced bundle file lists
        run: cargo xtask packaging files src-tauri/target/aarch64-apple-darwin/release/bundle packaging-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: packaging-macos
          path: packaging-macos.txt
      # Each signing step removes its keychain and key files when it ends; this catches one that was cut short.
      - name: Remove the signing keychain and the notary's key
        if: always() && needs.changes.outputs.sign == 'true'
        run: cargo xtask release forget-secrets
      - name: The .dmg window as Finder shows it (screenshots, light and dark; informational)
        continue-on-error: true
        timeout-minutes: 4
        run: cargo xtask release package-screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmg-window-screenshots
          path: dmg-screens/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-macOS-AppleSilicon-dmg
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # CI only: the same app built with the `probe` feature (src-tauri/src/probe.rs), which adds the probe page and the
  # switch that loads it into the room window, and the flows run on it. The release app (`macos`) has neither. No
  # secrets: it is never signed.
  macos-native:
    name: macOS (Apple Silicon) native flows on the probe app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      # The Rust build cache it shares with `macos`; this job builds all of it, so this job writes it (on main only).
      - uses: ./.github/actions/setup-rust
        with:
          cache: macos
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: target/web
          key: web-${{ hashFiles('web.pin.json', 'scripts/build-web.mjs', 'scripts/web-release.mjs') }}
      - name: The build tooling's own tests (xtask), compiled for macOS
        run: cargo test --locked --manifest-path xtask/Cargo.toml
      - name: Build the CI probe app (feature probe; never shipped)
        run: cargo xtask probe probe-app
      - name: Record produced probe bundle file list
        run: cargo xtask packaging files src-tauri/target/aarch64-apple-darwin/release/bundle packaging-macos-probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: packaging-macos-probe
          path: packaging-macos-probe.txt
      - name: Portable native local-host fixtures
        run: cargo xtask test-support
      - name: Reset cleanup safety tests (temporary directories only)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- data::tests platform::webview_data --test-threads=1
      - name: The local host from the bundled page (stand-in core on its published socket, pairing, proxy, refusals)
        run: cargo xtask probe local-host
      - name: What the interface's window offers (probe page, same origin and permission rule)
        run: cargo xtask probe probe
      - name: The call controls card over a full-screen editor (never activating, clicks, drag, typing, states)
        run: cargo xtask probe card
      - name: Restarting and quitting with a model on the GPU loaded (each process ends cleanly, no crash report)
        run: cargo xtask probe exit
      # Informational for now: the settings-cycle step of this walk intermittently keeps 50 to 330 MiB after the models' idle
      # keep (about one run in two), with the host holding nothing (#145). It becomes a gate once that is fixed.
      # A run takes about 4.5 minutes; the app also hangs in the card-cycle step in about 40% of runs (#27), which used to
      # cost the whole 25 minutes. The walk gives up itself after 2 minutes without a step and samples the app first;
      # the 8 minutes here only back that up.
      - name: The app's footprint stays flat over models, calls and setting changes (table, fails only on clear growth)
        continue-on-error: true
        timeout-minutes: 8
        run: cargo xtask probe memory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-controls-screenshots
          path: card-shots/
          retention-days: 7
          if-no-files-found: warn

  # A call on the engine's real models through the app's adapter: the app's Rust tests (`cargo test`), no app bundle,
  # so it needs neither the probe app nor the web interface, and runs beside them. No secrets.
  macos-call:
    name: macOS (Apple Silicon) a call on the engine's real models
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      # A Rust build cache of its own: a test build compiles the dependencies apart from the app's.
      - uses: ./.github/actions/setup-rust
        id: rust
      # The models the call downloads, in the engine's storage, by the engine's commit (its catalogue names each
      # model's files and their digests) and by the test (which models it picks). Saved only after a passing run, and
      # only on a push to main (below).
      - uses: actions/cache/restore@v4
        id: models
        with:
          path: ${{ runner.temp }}/real-call-models
          key: real-call-models-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.engine-rev }}-${{ hashFiles('src-tauri/src/voice/models/tests.rs') }}
          restore-keys: real-call-models-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.engine-rev }}-
      - name: A call on the engine's real models through the app's adapter (recorded speech in, a reply out)
        env:
          SIDEVOICE_REAL_CALL_MODELS: ${{ runner.temp }}/real-call-models
        run: cargo xtask probe voice-models
      - name: The footprint and Metal allocation stay flat over calls and changes of a call's settings (table, fails only on clear growth)
        env:
          SIDEVOICE_REAL_CALL_MODELS: ${{ runner.temp }}/real-call-models
        run: cargo xtask probe voice-memory
      - if: steps.models.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/real-call-models
          key: ${{ steps.models.outputs.cache-primary-key }}

  linux:
    name: Linux (.deb, .AppImage)
    needs: changes
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: target/web
          key: web-${{ hashFiles('web.pin.json', 'scripts/build-web.mjs', 'scripts/web-release.mjs') }}
      # A release and the nightly sign the AppImage / the installer as updates with the updater's key; no
      # other run reads it.
      - name: Build the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ (needs.changes.outputs.channel == 'release' || needs.changes.outputs.channel == 'nightly') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ (needs.changes.outputs.channel == 'release' || needs.changes.outputs.channel == 'nightly') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: cargo xtask bundle --channel ${{ needs.changes.outputs.channel }}
      - name: Record produced bundle file lists
        run: cargo xtask packaging files src-tauri/target/release/bundle packaging-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: packaging-linux
          path: packaging-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-Linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows (installer)
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: target/web
          key: web-${{ hashFiles('web.pin.json', 'scripts/build-web.mjs', 'scripts/web-release.mjs') }}
      # A release and the nightly sign the AppImage / the installer as updates with the updater's key; no
      # other run reads it.
      - name: Portable native local-host fixtures
        run: cargo xtask test-support
      - name: Build the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ (needs.changes.outputs.channel == 'release' || needs.changes.outputs.channel == 'nightly') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ (needs.changes.outputs.channel == 'release' || needs.changes.outputs.channel == 'nightly') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: cargo xtask bundle --channel ${{ needs.changes.outputs.channel }}
      # The Windows app starts: the bundled interface comes up in WebView2 (no settings; a throwaway runner only).
      - name: First open (no settings), the bundled interface comes up
        run: cargo xtask release first-open
      - name: Record produced bundle file lists
        run: cargo xtask packaging files src-tauri/target/release/bundle packaging-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: packaging-windows
          path: packaging-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 7
          if-no-files-found: error
      # Last, so the installer and its first open always run: the same tests the Linux job runs, here with the
      # Windows-only ones (platform/), every crate's even when one fails. Through xtask, which runs cargo in src-tauri:
      # only from there does Cargo read src-tauri/.cargo/config.toml, whose static C runtime the engine's native
      # libraries need to link (LNK2038 otherwise). The bridge script's tests read the web interface, as on Linux.
      - name: The web interface at the pin (web.pin.json)
        run: cargo xtask web
      - name: Bridge script and Rust unit tests
        run: cargo xtask test

  # Publish: the installers of this run go to the release that called it, or replace the rolling `nightly` pre-release
  # (RELEASING.md). Pull requests never get here. Two jobs with the same steps (a YAML anchor) because a job's `needs`
  # cannot depend on the run: the nightly waits for the installers' jobs and the lint only, while the native flows
  # (`macos-native`, `macos-call`) run on beside it; a release waits for every job, so it never ships with a native
  # flow failing.
  publish-nightly:
    name: Publish (nightly)
    needs: [changes, test, macos, linux, windows]
    if: needs.changes.outputs.publish == 'nightly'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env: &publish-env
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KIND: ${{ needs.changes.outputs.publish }}
      TAG: ${{ inputs.release-tag }}
    steps: &publish-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      # The runner's own Rust builds the xtask (one cache for both publish jobs).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xtask
          shared-key: publish
      - uses: actions/download-artifact@v4
        with:
          pattern: Sidevoice-*
          path: artifacts
      # Also every platform's update and its signature, checked, and latest.json: a release's feed, or the nightly's.
      - name: The assets and their SHA256SUMS
        run: cargo xtask publish assets "$KIND" $TAG
      - name: Attach to the release, then publish it (a version with -rc.N is a pre-release, never latest)
        if: env.KIND == 'release'
        run: cargo xtask publish release "$TAG"
      - name: Replace the nightly pre-release (move its tag here, replace every asset)
        if: env.KIND == 'nightly'
        env:
          WHEN: ${{ github.event.head_commit.timestamp }}
        run: cargo xtask publish nightly

  publish-release:
    name: Publish (release)
    needs: [changes, test, macos, macos-native, macos-call, linux, windows]
    if: needs.changes.outputs.publish == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env: *publish-env
    steps: *publish-steps
