name: build

# What runs when (RELEASING.md):
# - pull request: lint + unit tests on Linux, and the Windows and Linux app builds (the repo is public: Actions
#   minutes are free); the Apple-Silicon native-engine jobs only when the engine, its pin, the bridge or the CI
#   probes change (`changes` below).
# - push to main, manual run: everything, installers included; a green run on main replaces the `nightly` pre-release.
# - a release (called by release-please.yml with the tag it created): everything, attached to that release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: The draft release release-please created (vX.Y.Z); its assets are built from that tag.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Per ref. A release (github.workflow is the caller's, release-please) never shares a group with a push.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - name: Webview toolkit (the shell links against it even to lint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bridge script tests
        run: npm test
      - name: The icons, tray and .dmg window are what the brand files draw (npm run icons)
        run: |
          npm run icons
          git status --porcelain -- src-tauri/icons src-tauri/dmg ui/brand
          git diff --quiet --exit-code -- src-tauri/icons src-tauri/dmg ui/brand
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --workspace
      - name: The local host with two users (a second uid cannot open local.sock, link as a connector, or use the proxy)
        working-directory: src-tauri
        run: |
          set -euo pipefail
          # src-tauri/local-host/examples/local-host-ci.rs: `serve` as this user (a stand-in core on local.sock, the
          # app's side paired with it, the proxy), `attack` as another.
          cargo build -p sidevoice-local-host --example local-host-ci
          mkdir -p /tmp/svci && chmod 755 /tmp/svci
          TOOL=/tmp/svci/local-host-ci
          cp target/debug/examples/local-host-ci "$TOOL" && chmod 755 "$TOOL"
          sudo useradd --create-home sidevoice-other
          "$TOOL" serve /tmp/svci/d /tmp/svci/app /tmp/svci/port > /tmp/svci/serve.log 2>&1 &
          SERVE=$!
          for i in $(seq 1 50); do [ -s /tmp/svci/port ] && break; sleep 0.2; done
          PORT=$(cat /tmp/svci/port)
          ls -la /tmp/svci /tmp/svci/d
          echo "--- the second user"
          sudo -u sidevoice-other "$TOOL" attack /tmp/svci/d /tmp/svci/app "$PORT"
          echo "--- the same attempts as the first user (control: the socket and the files are open to it)"
          if "$TOOL" attack /tmp/svci/d /tmp/svci/app "$PORT"; then echo "the control got nowhere"; exit 1; fi
          kill "$SERVE"
          echo "--- serve"; cat /tmp/svci/serve.log
          # The second user's attempts never reached the core: it saw only the first user's requests.
          if grep -q "auth=other" /tmp/svci/serve.log; then echo "the core saw a foreign token"; exit 1; fi

  changes:
    name: What this run builds
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      # The Apple-Silicon engine round trip, the probe page and the room flow.
      native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native == 'true' }}
      # The .dmg: never on a pull request. (Windows and Linux build their installers on every run.)
      installers: ${{ github.event_name != 'pull_request' }}
      # Where the installers go: the release that called this, or the rolling `nightly` pre-release on a push to main.
      publish: ${{ inputs.release-tag && 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nightly' || '' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            native:
              - 'src-tauri/engine/**'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'src-tauri/rust-toolchain.toml'
              - 'src-tauri/Entitlements.plist'
              - '.github/actions/**'
              - '.github/workflows/build.yml'
              - 'src-tauri/local-host/**'
              - 'src-tauri/src/local_host.rs'
              - 'src-tauri/src/engine_ipc.rs'
              - 'src-tauri/src/probe.rs'
              - 'src-tauri/src/call_controls.rs'
              - 'src-tauri/core/src/call_controls.rs'
              - 'src-tauri/src/lib.rs'
              - 'src-tauri/capabilities/**'
              - 'src-tauri/tauri.conf.json'
              - 'src-tauri/core/src/engines.rs'
              - 'src-tauri/core/src/bridge.rs'
              - 'bridge/**'
              - 'test/fixtures/**'
              - 'ui/voice/**'

  macos:
    name: macOS (Apple Silicon) .dmg and native flow
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app bundle (ad-hoc signed, hardened runtime, entitlements)
        if: needs.changes.outputs.installers == 'true'
        run: npx tauri build --target aarch64-apple-darwin --bundles app
      - name: Check what a first open depends on
        if: needs.changes.outputs.installers == 'true'
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          test -d "$APP"
          echo "--- Info.plist"
          plutil -p "$APP/Contents/Info.plist"
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Contents/Info.plist"
          test "$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")" = "13.0"
          echo "--- signature"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | tee /tmp/sig.txt
          grep -q "Signature=adhoc" /tmp/sig.txt
          grep -q "runtime" /tmp/sig.txt
          echo "--- entitlements"
          codesign -d --entitlements - --xml "$APP" > /tmp/ent.xml
          cat /tmp/ent.xml; echo
          grep -q "com.apple.security.device.audio-input" /tmp/ent.xml
          # The engine is linked into the app: no downloaded library is loaded, so library validation stays on.
          if grep -q "com.apple.security.cs.disable-library-validation" /tmp/ent.xml; then echo "library validation is off"; exit 1; fi
          echo "--- icon"
          test "$(plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist")" = "icon.icns"
          iconutil --convert iconset --output /tmp/icon.iconset "$APP/Contents/Resources/icon.icns"
          ls /tmp/icon.iconset
          for f in 16x16 16x16@2x 32x32 32x32@2x 128x128 128x128@2x 256x256 256x256@2x 512x512 512x512@2x; do
            test -s "/tmp/icon.iconset/icon_$f.png"
          done
          sips -g pixelWidth /tmp/icon.iconset/icon_512x512@2x.png | grep -q 1024
          # How macOS itself decodes every entry, for the record (uploaded with the .dmg window screenshots).
          mkdir -p dmg-screens && cp -R /tmp/icon.iconset dmg-screens/
          test "$(plutil -extract CFBundleName raw "$APP/Contents/Info.plist")" = "Sidevoice"
          echo "--- architecture"
          lipo -archs "$APP/Contents/MacOS/sidevoice-desktop" | tee /dev/stderr | grep -q arm64
          echo "--- no CI probe in a release (src-tauri/src/probe.rs is behind the probe feature)"
          if grep -q "SIDEVOICE_DEBUG_PAGE" "$APP/Contents/MacOS/sidevoice-desktop"; then echo "the probe switch is in the release app"; exit 1; fi
          if grep -q "probe-engine" "$APP/Contents/MacOS/sidevoice-desktop"; then echo "the probe page is in the release app"; exit 1; fi
          if grep -q "probe-card" "$APP/Contents/MacOS/sidevoice-desktop"; then echo "the call controls probe is in the release app"; exit 1; fi
          if grep -Eq "SIDEVOICE_DEBUG_LOCAL_HOST_FLOW|local-host-flow" "$APP/Contents/MacOS/sidevoice-desktop"; then echo "the local-host flow is in the release app"; exit 1; fi
      - name: First open (no settings) — the bundled interface comes up in the real WKWebView
        if: needs.changes.outputs.installers == 'true'
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          # Asking for the probe page changes nothing in a release: the interface loads (checked below).
          SIDEVOICE_DEBUG=1 SIDEVOICE_DEBUG_PAGE=probe.html SIDEVOICE_DEBUG_ROOM_FLOW=1 "$APP/Contents/MacOS/sidevoice-desktop" > /tmp/app.log 2>&1 &
          PID=$!
          for i in $(seq 1 45); do grep -q "ready: true" /tmp/app.log && break; sleep 1; done
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then echo "The app exited on its own:"; cat /tmp/app.log; exit 1; fi
          kill "$PID"; cat /tmp/app.log
          # The interface loaded from the app itself, and its controller came up: the bridge attached to the
          # real web UI's store and actions, and reached the app over IPC.
          grep -q "page tauri://localhost/voice/index.html" /tmp/app.log
          if grep -Eq "probe.html" /tmp/app.log; then echo "a release ran a CI probe"; exit 1; fi
          grep -q "ready: true" /tmp/app.log
      - name: With a target (a fake node on loopback)
        if: needs.changes.outputs.installers == 'true'
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          CONF="$HOME/Library/Application Support/dev.sidevoice.desktop"
          mkdir -p "$CONF"
          printf '{"target":"http://127.0.0.1:8768","muteShortcut":""}' > "$CONF/settings.json"
          python3 -u test/fixtures/fake-node.py 8768 > /tmp/node.log 2>&1 &
          NODE=$!
          SIDEVOICE_DEBUG=1 "$APP/Contents/MacOS/sidevoice-desktop" > /tmp/target.log 2>&1 &
          PID=$!
          for i in $(seq 1 45); do grep -q "ready: true" /tmp/target.log && break; sleep 1; done
          sleep 5
          kill "$PID" || true
          kill "$NODE" || true  # the probe below starts its own on the same port
          rm -rf "$CONF"
          echo "--- app"; cat /tmp/target.log
          echo "--- fake node (what the interface asked, cross-origin)"; sort /tmp/node.log | uniq -c
          grep -q "ready: true" /tmp/target.log
          # The interface asked its target from the app's own origin (cross-origin), with no pairing yet.
          grep -q "origin=tauri://localhost" /tmp/node.log
      - name: Make the .dmg (the brand's window, with background, icon layout and volume icon)
        if: needs.changes.outputs.installers == 'true'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          # One TIFF with the 1x and 2x drawings: Finder picks the one for the screen.
          tiffutil -cathidpicheck src-tauri/dmg/background.png src-tauri/dmg/background@2x.png -out "$RUNNER_TEMP/background.tiff"
          mkdir -p dist
          DMG="dist/Sidevoice_${VERSION}_aarch64.dmg"
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s scripts/dmg-settings.py \
            -D app="$APP" -D background="$RUNNER_TEMP/background.tiff" \
            -D layout=src-tauri/dmg/layout.json -D icon=src-tauri/icons/icon.icns \
            Sidevoice "$DMG"
          hdiutil verify "$DMG"
          # Check the app as shipped, inside the image, not the one in the build tree.
          MNT=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG"
          ls -la "$MNT"
          test -s "$MNT/.background.tiff"
          test -L "$MNT/Applications"
          test -s "$MNT/.DS_Store"
          test -s "$MNT/.VolumeIcon.icns"
          codesign --verify --deep --strict --verbose=2 "$MNT/Sidevoice.app"
          codesign -d --entitlements - --xml "$MNT/Sidevoice.app" | grep -q "com.apple.security.device.audio-input"
          plutil -extract NSMicrophoneUsageDescription raw "$MNT/Sidevoice.app/Contents/Info.plist"
          hdiutil detach "$MNT"
          cp docs/FIRST_OPEN.txt dist/LEEME-primera-apertura.txt
          (cd dist && shasum -a 256 *.dmg | tee SHA256SUMS.txt)
      - name: The .dmg window as Finder shows it (screenshots, light and dark; informational)
        if: needs.changes.outputs.installers == 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -uo pipefail
          osa() { perl -e 'alarm shift; exec @ARGV' 30 osascript "$@"; }  # a permission prompt must not hang the job
          mkdir -p dmg-screens
          DMG=$(ls dist/*.dmg)
          hdiutil attach -readonly "$DMG" | tee /tmp/attach.txt
          VOL=$(grep -o '/Volumes/.*' /tmp/attach.txt | head -1)
          for mode in false true; do
            osa -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $mode" || true
            osa -e "tell application \"Finder\" to close every window" \
                      -e "tell application \"Finder\" to open (POSIX file \"$VOL\" as alias)" \
                      -e "tell application \"Finder\" to activate" || true
            sleep 4
            B=$(osa -e 'tell application "Finder" to get bounds of front window' | tr -d ' ')
            echo "window bounds ($mode): $B"
            IFS=, read -r X1 Y1 X2 Y2 <<< "${B:-0,28,1440,900}"
            screencapture -x -R"$X1,$((Y1 - 28)),$((X2 - X1)),$((Y2 - Y1 + 28))" "dmg-screens/dmg-dark-$mode.png" || screencapture -x "dmg-screens/dmg-dark-$mode-full.png"
          done
          osa -e 'tell application "Finder" to close every window' || true
          hdiutil detach "$VOL" || true
          ls -la dmg-screens
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.installers == 'true'
        with:
          name: dmg-window-screenshots
          path: dmg-screens/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.installers == 'true'
        with:
          name: Sidevoice-macOS-AppleSilicon-dmg
          path: dist/
          retention-days: 7
          if-no-files-found: error
      # CI only from here: the same app built with the `probe` feature (src-tauri/src/probe.rs), which adds the
      # probe page and the switch that loads it into the room window. The release app above has neither. On a pull
      # request (engine, bridge, catalogue or probe changes) only this part runs.
      - name: Build the CI probe app (feature probe; never shipped)
        run: |
          set -euo pipefail
          npx tauri build --target aarch64-apple-darwin --bundles app --features probe
          # The check on the release app means something: this build does carry the page and its switch.
          BIN="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app/Contents/MacOS/sidevoice-desktop"
          grep -q "SIDEVOICE_DEBUG_PAGE" "$BIN"
          grep -q "probe-engine" "$BIN"
          grep -q "probe-card" "$BIN"
          grep -q "SIDEVOICE_DEBUG_LOCAL_HOST_FLOW" "$BIN"
          grep -q "local-host-flow" "$BIN"
      - name: The local host from the bundled page (stand-in core on local.sock, pairing, proxy, refusals)
        run: |
          set -euo pipefail
          APP="$PWD/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          (cd src-tauri && cargo build --release -p sidevoice-local-host --example local-host-ci)
          TOOL="$PWD/src-tauri/target/release/examples/local-host-ci"
          # A home of its own and short (a Unix socket's path is at most 104 bytes): ~/.sidevoice and the app's config.
          export HOME=/tmp/svhome
          rm -rf "$HOME" && mkdir -p "$HOME"
          "$TOOL" core "$HOME/.sidevoice" > /tmp/lh-core.log 2>&1 &
          CORE=$!
          for i in $(seq 1 50); do [ -S "$HOME/.sidevoice/core/local.sock" ] && break; sleep 0.2; done
          SIDEVOICE_DEBUG=1 SIDEVOICE_DEBUG_LOCAL_HOST_FLOW=1 "$APP/Contents/MacOS/sidevoice-desktop" > /tmp/lh.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do grep -Eq "local-host-flow (ok|error)" /tmp/lh.log && break; sleep 1; done
          PORT=$(sed -nE 's|.*local-host proxy on http://127\.0\.0\.1:([0-9]+).*|\1|p' /tmp/lh.log | head -1)
          # What a page cannot send, from outside the app: each refused by the proxy, none reaching the core.
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$@" "http://127.0.0.1:$PORT/api/presentation/echo"; }
          FAILED=""
          expect() { got=$(code "${@:3}"); echo "$1: $got"; [ "$got" = "$2" ] || FAILED="$FAILED $1=$got"; }
          expect hostile-origin 403 -H "Origin: https://evil.example" -H "Authorization: Bearer x"
          expect no-origin 403 -H "Authorization: Bearer x"
          expect empty-origin 403 -H "Origin;" -H "Authorization: Bearer x"
          expect null-origin 403 -H "Origin: null" -H "Authorization: Bearer x"
          expect wrong-host 421 -H "Host: localhost:$PORT" -H "Origin: tauri://localhost"
          expect rebound-host 421 -H "Host: evil.example:$PORT" -H "Origin: tauri://localhost"
          expect no-secret 401 -H "Origin: tauri://localhost"
          expect guessed-secret 401 -H "Origin: tauri://localhost" -H "Authorization: Bearer AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          kill "$PID" || true
          sleep 1
          kill "$CORE" || true
          echo "--- app"; grep -E "local-host|proxy|page says" /tmp/lh.log || true
          echo "--- stand-in core"; cat /tmp/lh-core.log
          [ -z "$FAILED" ] || { echo "not refused as the table says:$FAILED"; exit 1; }
          # The bundled page: running, the pairing object, preflight → authenticated fetch with the token swapped in
          # and its Origin kept, 401 without the secret, 404 for native's own routes, a WebSocket spliced and refused.
          grep -q "local-host-flow ok" /tmp/lh.log
          LINE=$(grep "local-host-flow ok" /tmp/lh.log)
          for fact in version=2 state=running/api=1 subscribed=running pairing=ok host=fake-machine \
              fetch=200/device/tauri://localhost/the_bundled_page no_secret=401 native_only=404 \
              ws=open/sidevoice/ping_from_the_page ws_no_secret=refused; do
            echo "$LINE" | grep -q " $fact" || { echo "missing $fact"; exit 1; }
          done
          grep -q "proxy answered 204 OPTIONS /api/presentation/echo (preflight)" /tmp/lh.log
          # Only the page's authenticated requests reached the core, each with the device token.
          test "$(grep -c '/api/presentation/echo' /tmp/lh-core.log)" = 1
          grep -q "fake-core POST /api/presentation/echo origin=tauri://localhost auth=device" /tmp/lh-core.log
          grep -q "fake-core GET /api/browser/call origin=tauri://localhost auth=device" /tmp/lh-core.log
          if grep -Eq "auth=other|/api/local/health origin=tauri" /tmp/lh-core.log; then echo "the core saw what it should not"; exit 1; fi
          # The token, stored by the app alone: 0600 in its config directory.
          STORE="$HOME/Library/Application Support/dev.sidevoice.desktop/local-host.json"
          test "$(stat -f %Lp "$STORE")" = 600
      - name: What the interface's window offers (probe page, same origin and permission rule)
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          python3 -u test/fixtures/fake-node.py 8768 > /tmp/probe-node.log 2>&1 &
          NODE=$!
          SIDEVOICE_DEBUG=1 SIDEVOICE_DEBUG_PAGE=probe.html "$APP/Contents/MacOS/sidevoice-desktop" > /tmp/probe.log 2>&1 &
          PID=$!
          for i in $(seq 1 480); do grep -q "probe-voice" /tmp/probe.log && break; sleep 1; done
          kill "$PID" || true
          cat /tmp/probe.log
          echo "--- macOS $(sw_vers -productVersion)"
          grep -q "page tauri://localhost/probe.html" /tmp/probe.log
          # Pairing needs a secure context and WebCrypto ECDSA P-256 on the app's own origin.
          grep -q "probe origin=tauri://localhost secure=true ecdsa=true" /tmp/probe.log
          # A local node (http://127.0.0.1:8768) reached from the app's origin with a device token: preflight + CORS.
          kill "$NODE" || true
          grep -q 'probe-loopback 200 Bearer probe-token' /tmp/probe.log
          grep -q 'request OPTIONS /api/presentation/echo origin=tauri://localhost' /tmp/probe-node.log
          # The microphone is the app's here (host.voice): the page is never granted it.
          if grep -q "sidevoice: media Microphone .*Allow" /tmp/probe.log; then echo "the page got the microphone"; exit 1; fi
          # The native engine inside the signed app, through the bridge the interface uses (docs/BRIDGE.md):
          # capabilities with the OS's real memory (the CPU for sherpa-onnx, Metal for whisper.cpp, remote providers,
          # never Core ML), downloads with progress, the builds on disk by model + engine, a page engine refused rather
          # than replaced, and a cancelled download.
          grep -q 'probe-engine ok' /tmp/probe.log
          LINE=$(grep 'probe-engine ok' /tmp/probe.log)
          echo "$LINE" | grep -q 'capabilities={"runs":"native","os":"macos","arch":"aarch64","has":\['
          for accelerator in cpu metal remote; do echo "$LINE" | grep -q "\"has\":\[[^]]*\"$accelerator\""; done
          if echo "$LINE" | grep -q '"coreml"'; then echo "Core ML offered"; exit 1; fi
          echo "$LINE" | grep -Eq '"memory_mb":[1-9][0-9]{3,}'
          echo "$LINE" | grep -q ' installed=kokoro-82m-v1.0@sherpa-onnx,silero-vad@sherpa-onnx,whisper-tiny@whisper-cpp '
          echo "$LINE" | grep -Eq ' progress_calls=[1-9]'
          echo "$LINE" | grep -q ' refused=yes '
          echo "$LINE" | grep -Eq ' memory=\{"total_mb":[1-9][0-9]{3,},"available_mb":[1-9][0-9]*\}'
          echo "$LINE" | grep -q ' cancel=true/install_cancelled/false cancel_gone=true progress_event=bytes_per_s+done+engine+job+model+total:true '
          # sidevoice-engine's storage: a folder per installed build, nothing of the cancelled one, nothing half written.
          ENGINE="$HOME/Library/Application Support/dev.sidevoice.desktop/sidevoice-engine"
          ls -laR "$ENGINE/models"
          if find "$ENGINE/models" -path '*whisper-small*' | grep -q .; then echo "a cancelled download left files"; exit 1; fi
          if find "$ENGINE/partial" -type f | grep -q .; then echo "a download was left half written"; exit 1; fi
          # The voice call the app runs (host.voice): the seam's sixteen calls, the engine's catalogue with the voice
          # activity detector, an unknown model refused by key, Whisper configured on whisper.cpp, and a start that
          # settles: listening, or refused with the call's code where the runner has no microphone or speaker.
          grep -q 'probe-voice ok' /tmp/probe.log
          VOICE=$(grep 'probe-voice ok' /tmp/probe.log)
          echo "$VOICE" | grep -q ' keys=16 '
          echo "$VOICE" | grep -Eq ' models=[1-9][0-9]* vad=true unknown=voice_model_unknown '
          grep -q 'sidevoice: voice settings: .*"build":"whisper-tiny/whisper-cpp-q5_1"' /tmp/probe.log
          echo "$VOICE" | grep -Eq ' start=(ok|voice_failed/[a-z-]+) '
          echo "--- voice"; grep 'sidevoice: voice' /tmp/probe.log || true
          # Headset buttons: a (simulated) call made the app the Now Playing app, and it let go after.
          grep -q 'probe-headset ok' /tmp/probe.log
          grep -q 'headset apply active=true in_call=true mic=true' /tmp/probe.log
          grep 'headset apply' /tmp/probe.log | tail -1 | grep -q 'active=false in_call=false .* gesture_on=false' 
          grep 'headset apply' /tmp/probe.log
          # The app's own mute is not mistaken for an AirPods gesture.
          if grep -q 'headset airpods' /tmp/probe.log; then echo 'echo recorded as a gesture'; exit 1; fi
      - name: The call controls card over a full-screen editor (never activating, clicks, drag, typing, states)
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          mkdir -p card-shots
          swiftc -O -o /tmp/card-ci test/fixtures/card-ci.swift
          # The editor as an app of its own, so LaunchServices opens and activates it as it would the person's.
          mkdir -p /tmp/Editor.app/Contents/MacOS
          swiftc -O -o /tmp/Editor.app/Contents/MacOS/Editor test/fixtures/fullscreen-editor.swift
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleExecutable</key><string>Editor</string><key>CFBundleIdentifier</key><string>dev.sidevoice.ci-editor</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleName</key><string>Editor</string></dict></plist>' > /tmp/Editor.app/Contents/Info.plist
          /tmp/card-ci trusted
          trap 'echo "--- app"; grep -E "call-controls|probe-card" /tmp/card.log || true; echo "--- editor"; cat /tmp/editor.log || true' EXIT
          # Every check runs, and the step fails at the end with each that did not hold.
          FAILED=""
          fail() { echo "::error::$*"; FAILED="$FAILED"$'\n'"$*"; }
          # wait_for <log> <pattern> [after line]: the pattern appears in the log, after that line if given.
          wait_for() {
            for i in $(seq 1 60); do tail -n +"$((${3:-0} + 1))" "$1" | grep -q -- "$2" && return 0; sleep 1; done
            return 1
          }
          expect() { wait_for "$@" || fail "never saw in $1: $2"; }
          line() { wc -l < "$1" | tr -d ' '; }
          # The card's window as the window server has it on screen (global points): it must be in front of the editor.
          card() {
            /tmp/card-ci windows "$PID" "$EDITOR" | tee /tmp/windows.txt || true
            grep -q "card onscreen=true above_editor=true editor_onscreen=true" /tmp/windows.txt \
              || fail "the card is not on screen in front of the editor: $(head -1 /tmp/windows.txt)"
            if grep -q " x=" /tmp/windows.txt; then
              read -r X Y W H < <(sed -E 's/.* x=(-?[0-9]+) y=(-?[0-9]+) w=([0-9]+) h=([0-9]+).*/\1 \2 \3 \4/' /tmp/windows.txt)
            fi
          }
          editor_active() {
            tail -1 < <(grep "editor active=" /tmp/editor.log) | grep -q "active=true" || fail "the editor is not the active app ($1)"
          }

          # A call walked through the card's states (test/fixtures/card-probe.html); this page answers its buttons.
          # Each line with the time, to order it against the editor's and the input's.
          SIDEVOICE_DEBUG=1 SIDEVOICE_DEBUG_PAGE=card-probe.html "$APP/Contents/MacOS/sidevoice-desktop" \
            > >(perl -MTime::HiRes=time -ne '$|=1; printf "%.2f %s", time, $_' > /tmp/card.log) 2>&1 &
          PID=$!
          wait_for /tmp/card.log "probe-card phase=talking" || { fail "the probe never started"; exit 1; }
          # The person's editor, full screen in its own Space: the room's window loses focus and the card shows over it,
          # a non-activating panel at the status level, on every Space and over full-screen apps, never the key window.
          : > /tmp/editor.log
          open --stdout /tmp/editor.log --stderr /tmp/editor.log /tmp/Editor.app
          wait_for /tmp/editor.log "editor ready pid=" || { fail "the editor never started"; exit 1; }
          EDITOR=$(sed -nE 's/.*editor ready pid=([0-9]+).*/\1/p' /tmp/editor.log | head -1)
          expect /tmp/editor.log "editor fullscreen=true key=true"
          wait_for /tmp/card.log "call-controls shown" || { fail "the card never showed"; exit 1; }
          expect /tmp/card.log "call-controls panel "
          grep "call-controls panel " /tmp/card.log | tail -1 \
            | grep -q "nonactivating=true level=25 all_spaces=true fullscreen_auxiliary=true key=false visible=true .* app_active=false" \
            || fail "the panel is not what #4 asks: $(grep 'call-controls panel ' /tmp/card.log | tail -1)"
          expect /tmp/card.log "call-controls watching clicks elsewhere: true"
          expect /tmp/card.log "call-controls prevents activation: true"
          sleep 3
          card
          [ -n "${X:-}" ] || { fail "the card's window was never found"; exit 1; }
          screencapture -x card-shots/1-over-fullscreen-you-talking.png
          # The card's page may not capture: it asked for the microphone (probe build) and was refused.
          expect /tmp/card.log 'call-controls refused {"capture":"[A-Za-z-]*","command":"probe-capture"}'
          grep 'call-controls refused {"capture"' /tmp/card.log | tail -1 | grep -q '"capture":"NotAllowedError"' \
            || fail "the card's page was not refused the microphone"
          grep -q "call-controls permission Microphone denied" /tmp/card.log || fail "the app did not deny the card's request"
          # The editor has the keyboard.
          /tmp/card-ci type "abc"
          expect /tmp/editor.log "editor text=abc"

          # The pointer over the card (the app polls it: a panel that is never key gets no hover): its controls appear
          # below it, and the window grows to hold them.
          /tmp/card-ci move $((X + 160)) $((Y + 30))
          expect /tmp/card.log "call-controls pointer inside=Some(true) app_active=false"
          sleep 1.5
          card
          [ "$H" -ge 110 ] || fail "the card did not grow with its controls (h=$H)"
          screencapture -x card-shots/2-near-you-talking.png

          # A click on the title (no move) opens the conversations below the controls; a click in the editor closes it.
          /tmp/card-ci click $((X + 90)) $((Y + 31))
          sleep 1.5
          card
          [ "$H" -ge 200 ] || fail "the conversations did not open (h=$H)"
          screencapture -x card-shots/3-conversations.png
          FROM=$(line /tmp/card.log)
          /tmp/card-ci click 200 700
          expect /tmp/card.log "call-controls outside click" "$FROM"
          editor_active "after a click in it"

          # A drag from the card (not a button) moves it; let go, it is dropped and remembered. The app stays inactive.
          /tmp/card-ci move $((X + 160)) $((Y + 30))
          expect /tmp/card.log "call-controls pointer inside=Some(true)" "$FROM"
          sleep 1
          card
          BEFORE="$X $Y"
          FROM=$(line /tmp/card.log)
          /tmp/card-ci drag $((X + 40)) $((Y + 39)) -300 200
          expect /tmp/card.log "call-controls dropped at .* app_active=false" "$FROM"
          sleep 1
          card
          [ "$X $Y" != "$BEFORE" ] || fail "the card did not move"
          screencapture -x card-shots/4-dragged.png
          editor_active "after a drag"

          # Its mute button, clicked: the command reaches the room, the app never becomes active, and typing still
          # reaches the editor. Muted, then unmuted again (the probe then moves on).
          for state in muted unmuted; do
            /tmp/card-ci move $((X + 160)) $((Y + 30)); sleep 1; card
            FROM=$(line /tmp/card.log)
            /tmp/card-ci click $((X + 66)) $((Y + H - 37))
            expect /tmp/card.log "call-controls run toggle-mute app_active=false" "$FROM"
            expect /tmp/card.log "probe-card command toggle-mute" "$FROM"
            sleep 1
            screencapture -x "card-shots/5-$state.png"
            editor_active "after mute ($state)"
          done
          /tmp/card-ci type "def"
          expect /tmp/editor.log "editor text=abc.*def"
          editor_active "at the end of the clicks"

          # The other states, near (controls) and away (at rest).
          expect /tmp/card.log "probe-card phase=working"; sleep 2; screencapture -x card-shots/6-near-agent-working.png
          expect /tmp/card.log "probe-card phase=speaking"; sleep 2; screencapture -x card-shots/7-near-agent-speaking.png
          FROM=$(line /tmp/card.log)
          /tmp/card-ci move 200 700
          expect /tmp/card.log "call-controls pointer inside=Some(false) app_active=false" "$FROM"
          expect /tmp/card.log "probe-card phase=muted"; sleep 2; screencapture -x card-shots/8-rest-muted-agent-speaking.png
          expect /tmp/card.log "probe-card phase=reconnecting"; sleep 2; screencapture -x card-shots/9-rest-reconnecting.png
          # Its hang-up button ends the call; the card goes with it (after that, not from an earlier hide).
          if grep -q "call-controls hidden" /tmp/card.log; then fail "the card hid before the call ended"; fi
          card
          /tmp/card-ci move $((X + 160)) $((Y + 30)); sleep 1.5; card
          FROM=$(line /tmp/card.log)
          /tmp/card-ci click $((X + W - 45)) $((Y + H - 37))
          expect /tmp/card.log "probe-card command hang-up" "$FROM"
          HUNG_UP=$(grep -n "probe-card command hang-up" /tmp/card.log | tail -1 | cut -d: -f1)
          expect /tmp/card.log "call-controls hidden" "${HUNG_UP:-$FROM}"
          expect /tmp/card.log "probe-card done" "$FROM"
          if grep -q "editor active=false" /tmp/editor.log; then fail "the editor stopped being the active app"; fi
          # Nor the keyboard: its window stays key from full screen on (a loss put right later still counts).
          if sed -n '/editor fullscreen=true key=true/,$p' /tmp/editor.log | grep -q "editor key=false"; then
            fail "the editor's window lost the keyboard: $(grep 'editor key=false' /tmp/editor.log | head -1)"
          fi
          kill "$PID" "$EDITOR" || true
          if [ -n "$FAILED" ]; then echo "failed:$FAILED"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-controls-screenshots
          path: card-shots/
          retention-days: 7
          if-no-files-found: warn
  linux:
    name: Linux (.deb, .AppImage)
    needs: changes
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-Linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows (installer)
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error

  # Only after every job above passed: the installers of this run go to the release that called it, or replace the
  # rolling `nightly` pre-release (RELEASING.md). Pull requests never get here.
  publish:
    name: Publish (release or nightly)
    needs: [changes, test, macos, linux, windows]
    if: needs.changes.outputs.publish != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KIND: ${{ needs.changes.outputs.publish }}
      TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: Sidevoice-*
          path: artifacts
      - name: The assets and their SHA256SUMS
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir assets
          find artifacts -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} assets/ \;
          if [ "$KIND" = nightly ]; then
            # Stable names, so a link to the nightly .dmg keeps working; the app inside still says $VERSION.
            for f in assets/*; do mv "$f" "${f/_${VERSION}_/_nightly_}"; done
          fi
          for ext in dmg exe deb AppImage; do ls assets/*."$ext" >/dev/null; done
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -la assets; cat assets/SHA256SUMS
      - name: Attach to the release, then publish it (a version with -rc.N is a pre-release, never latest)
        if: env.KIND == 'release'
        run: |
          set -euo pipefail
          gh release upload "$TAG" assets/* --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
      - name: Replace the nightly pre-release (move its tag here, replace every asset)
        if: env.KIND == 'nightly'
        env:
          WHEN: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          fi
          NOTES="Snapshot of \`main\` at $GITHUB_SHA (committed $WHEN). Not a versioned release: the \`nightly\` tag moves to every commit on \`main\` whose CI passes, and these assets are replaced each time. Versioned releases are the \`vX.Y.Z\` ones."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "Nightly (main)" --notes "$NOTES" --prerelease --latest=false
            gh release upload nightly assets/* --clobber
            # Anything left from an older snapshot that this one did not replace.
            gh release view nightly --json assets -q '.assets[].name' | while read -r name; do
              [ -e "assets/$name" ] || gh release delete-asset nightly "$name" --yes
            done
          else
            gh release create nightly assets/* --verify-tag --title "Nightly (main)" --notes "$NOTES" \
              --prerelease --latest=false
          fi
