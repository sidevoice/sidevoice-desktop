name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Webview toolkit (the shell links against it even to lint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bridge script tests
        run: npm test
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --workspace

  macos:
    name: macOS (Apple Silicon) .dmg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app bundle (ad-hoc signed, hardened runtime, entitlements)
        run: npx tauri build --target aarch64-apple-darwin --bundles app
      - name: Check what a first open depends on
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          test -d "$APP"
          echo "--- Info.plist"
          plutil -p "$APP/Contents/Info.plist"
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Contents/Info.plist"
          test "$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")" = "13.0"
          echo "--- signature"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | tee /tmp/sig.txt
          grep -q "Signature=adhoc" /tmp/sig.txt
          grep -q "runtime" /tmp/sig.txt
          echo "--- entitlements"
          codesign -d --entitlements - --xml "$APP" > /tmp/ent.xml
          cat /tmp/ent.xml; echo
          grep -q "com.apple.security.device.audio-input" /tmp/ent.xml
          echo "--- architecture"
          lipo -archs "$APP/Contents/MacOS/sidevoice-desktop" | tee /dev/stderr | grep -q arm64
      - name: Smoke test (the app starts and stays up)
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          SIDEVOICE_DEBUG=1 "$APP/Contents/MacOS/sidevoice-desktop" > /tmp/app.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 "$PID" 2>/dev/null; then echo "The app exited on its own:"; cat /tmp/app.log; exit 1; fi
          kill "$PID"; cat /tmp/app.log
          # First run: the bundled settings window loaded and reached the app over IPC.
          grep -q "get_settings (first run: true)" /tmp/app.log
      - name: Bridge test in the real WKWebView (fake room on loopback)
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app"
          CONF="$HOME/Library/Application Support/dev.sidevoice.desktop"
          mkdir -p "$CONF"
          printf '{"roomUrl":"http://127.0.0.1:8765/","muteShortcut":""}' > "$CONF/settings.json"
          (cd test/fixtures && python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/http.log 2>&1 &)
          SIDEVOICE_DEBUG=1 "$APP/Contents/MacOS/sidevoice-desktop" > /tmp/bridge.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do grep -q "mic=" /tmp/bridge.log && break; sleep 1; done
          kill "$PID" || true
          rm -rf "$CONF"
          cat /tmp/bridge.log
          # The page's injected script reached the app over IPC from a remote origin, the runtime
          # capability let it through, and the store subscription follows the call.
          grep -q "ready: true" /tmp/bridge.log
          grep -q "joined: true" /tmp/bridge.log
          grep -q "desktopHost=true" /tmp/bridge.log
          echo "--- what this webview offers the in-browser models (macOS $(sw_vers -productVersion))"
          grep -o 'webgpu=[^"]*' /tmp/bridge.log | tail -1
          echo "--- microphone: the app's per-origin decision, then what the page got (informational)"
          grep "sidevoice: media" /tmp/bridge.log || echo "(WebKit did not ask the app)"
      - name: Make the .dmg
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          STAGE=$(mktemp -d)
          cp -R src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sidevoice.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          DMG="dist/Sidevoice_${VERSION}_aarch64.dmg"
          hdiutil create -volname "Sidevoice" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          # Check the app as shipped, inside the image, not the one in the build tree.
          MNT=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG"
          ls -la "$MNT"
          test -L "$MNT/Applications"
          codesign --verify --deep --strict --verbose=2 "$MNT/Sidevoice.app"
          codesign -d --entitlements - --xml "$MNT/Sidevoice.app" | grep -q "com.apple.security.device.audio-input"
          plutil -extract NSMicrophoneUsageDescription raw "$MNT/Sidevoice.app/Contents/Info.plist"
          hdiutil detach "$MNT"
          cp docs/FIRST_OPEN.txt dist/LEEME-primera-apertura.txt
          (cd dist && shasum -a 256 *.dmg | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-macOS-AppleSilicon-dmg
          path: dist/
          retention-days: 30
          if-no-files-found: error

  linux:
    name: Linux (.deb, .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-Linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30
          if-no-files-found: error

  windows:
    name: Windows (installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error
