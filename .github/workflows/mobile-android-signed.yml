name: mobile-android-signed

# The Android app signed with the upload key (docs/MOBILE.md → "Signing"): run on every push to main (the desktop
# nightly's trigger) and by hand, and only from main. The signed APK is kept as an artifact and attached to the public
# `nightly` pre-release (RELEASING.md → "Nightly"). It is a workflow of its own, never run by a pull request, so the
# secrets below are read by this job alone and never by code a pull request changed. The build it signs is the one
# mobile.yml builds on every pull request.
#
# The repository's Actions secrets (the keystore is the PKCS#12 file of the upload key, base64 encoded):
#   ANDROID_UPLOAD_KEYSTORE_B64, ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS
#
# Every external action here, and in the composite action it uses, is pinned by its full commit SHA (the version in a
# comment): a moved tag would run new code in the job that holds the keystore, and no step-scoped secret stops code that
# ran before it from changing what the signing step runs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read


env:
  CARGO_TERM_COLOR: always
  # The bundled web interface is a release of sidevoice-web (web.pin.json): its attestation is verified wherever it is
  # fetched (`npm run web`, and every Tauri build through it), with gh and this run's token.
  SIDEVOICE_WEB_ATTESTATION: require
  GH_TOKEN: ${{ github.token }}

jobs:
  android:
    name: Android (APK signed with the upload key)
    # A run of another branch is refused here, not by the secrets: whoever can push a branch can change its workflow.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # A newer push replaces an older build (nothing is published from here). Read-only token: the steps below run
    # npm, Gradle and Cargo code, which never see a token that can write.
    concurrency:
      group: mobile-android-signed-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-android
      - name: The unsigned APK (universal: arm64-v8a and armeabi-v7a)
        run: cargo xtask mobile build android
      # The only step that sees the secrets: it aligns the APK for 16 KB pages, signs it, verifies the signature and
      # checks the native libraries' alignment. The keystore and its password are files only the runner's user can
      # read, removed when it ends.
      - name: Align, sign and check the APK
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: cargo xtask mobile sign android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Sidevoice-android-signed-apk
          path: dist/Sidevoice-android.apk
          retention-days: 14
          if-no-files-found: error

  # The only job with a token that can write, and it runs no build: it downloads the signed APK and attaches it to the
  # `nightly` pre-release (`gh release upload --clobber` deletes an asset before it uploads the new one, so this job
  # is never cancelled half way: runs queue, and the newest waiting one replaces an older waiting one). The release's
  # other assets and its SHA256SUMS are the desktop publish-nightly's (build.yml): one writer per file.
  publish:
    name: Attach the APK to the nightly pre-release
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: mobile-android-signed-publish
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Sidevoice-android-signed-apk
          path: dist
      - name: Attach the APK and its checksum to the nightly pre-release
        run: cargo xtask publish apk-nightly
