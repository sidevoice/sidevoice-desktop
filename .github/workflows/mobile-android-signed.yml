name: mobile-android-signed

# The Android app signed with the upload key (docs/MOBILE.md → "Signing"): run by hand, and only from main. It is a
# workflow of its own, never run by a pull request, so the secrets below are read by this job alone and never by code a
# pull request changed. The build it signs is the one mobile.yml builds on every pull request.
#
# The repository's Actions secrets (the keystore is the PKCS#12 file of the upload key, base64 encoded):
#   ANDROID_UPLOAD_KEYSTORE_B64, ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-signed
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The bundled web interface is a release of sidevoice-web (web.pin.json): its attestation is verified wherever it is
  # fetched (`npm run web`, and every Tauri build through it), with gh and this run's token.
  SIDEVOICE_WEB_ATTESTATION: require
  GH_TOKEN: ${{ github.token }}

jobs:
  android:
    name: Android (APK signed with the upload key)
    # A run of another branch is refused here, not by the secrets: whoever can push a branch can change its workflow.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: The unsigned APK (arm64)
        run: cargo xtask mobile build android
      # The only step that sees the secrets: it aligns the APK for 16 KB pages, signs it, verifies the signature and
      # checks the native libraries' alignment. The keystore and its password are files only the runner's user can
      # read, removed when it ends.
      - name: Align, sign and check the APK
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: cargo xtask mobile sign android
      - uses: actions/upload-artifact@v4
        with:
          name: Sidevoice-android-arm64-signed-apk
          path: dist/Sidevoice-android-arm64.apk
          retention-days: 14
          if-no-files-found: error
