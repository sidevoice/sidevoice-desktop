[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Build tooling for the desktop app: every CI step, run as `cargo xtask <command>` (.cargo/config.toml)."

# A package of its own, beside the repository's Cargo workspace (the root Cargo.toml): it builds with no webview, native engine or C
# toolchain, on any machine with Rust.
[workspace]

[dependencies]
# tauri.conf.json's version, notarytool's answer.
serde_json = "1"
# RFC 7396 merge-patch, as Tauri layers its per-OS and per-channel config.
json-patch = { version = "4", default-features = false }
# SHA256SUMS.
sha2 = "0.10"
# The checks on what the app and its stand-ins log, as the YAML's grep patterns were.
regex = "1"
# The platform-boundary check reads Rust tokens (comments and string contents are not code) and `use` trees.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", default-features = false, features = ["full", "parsing", "proc-macro", "visit"] }
# The host-kind checks read the Cargo manifests (features, target tables, lints) and the workflows (the commands of
# their steps) as data, not as text.
toml = "1"
serde_yaml_ng = "0.10"

# Shared child lifetime, private files and release-target facts; no core application dependency.
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.16.1" }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "macros"] }
# Ctrl+C on every host, plus SIGTERM/SIGHUP on Unix CI runners.
ctrlc = { version = "3.5", features = ["termination"] }
getrandom = "0.3"
# The Android APK, read for its native libraries' alignment (mobile/check.rs).
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The built iOS app's Info.plist (binary) and privacy manifest (mobile/ios.rs).
plist = "1"

[target.'cfg(unix)'.dependencies]
# Preserve the bundler's inherited private creation mask without own FFI.
rustix = { version = "1", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
# The Known Folders (RoamingAppData, LocalAppData) through SHGetKnownFolderPath.
dirs = "7"

[dev-dependencies]
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.16.1", features = ["test-support"] }
tempfile = "3"
# How tauri-plugin-updater orders versions: the tests check the nightly's against it.
semver = "1"
