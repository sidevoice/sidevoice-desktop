# The Rust workspace of the repository: the desktop app (desktop/) with the crates it is made of, the mobile app
# (mobile/) with its plugin, and the local host's test fixtures (test-support/). A build for iOS or Android names its
# package (-p): the workspace holds the other kind of host too. xtask/ is not a member: it is a package and workspace of
# its own, so it builds with no webview, native engine or C toolchain. Cargo reads desktop/.cargo/config.toml and
# desktop/rust-toolchain.toml only from desktop/ (`cargo xtask` runs cargo there).
[workspace]
resolver = "2"
members = ["desktop", "desktop/core", "desktop/engine", "desktop/local-host", "mobile", "mobile/plugin", "test-support"]

# Profiles are read from the workspace root only.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
